# Apps built from source, as one machine runs them. They name that machine's folders and services, so
# they are not in the catalogue; they are here as worked examples of every field a source table takes
# (docs/source-builds.md). Copy one into ~/.config/upkeep/apps.toml and change its paths.

[apps.whisper]
name = "whisper.cpp"
kind = "source"
repo = "ggml-org/whisper.cpp"
dir = "~/whisper.cpp"
move = "detach"
check = [
	"sh",
	"-c",
	'''[ -d "$HOME/whisper.cpp/.git" ] || exit 127; git -C "$HOME/whisper.cpp" describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' ''',
]
keep = ["build"]
build = ["cmake --build build -j 6"]
test = [{ name = "whisper-cli starts", run = ["build/bin/whisper-cli", "--help"], timeout_s = 30 }]

[apps.llama]
name = "llama.cpp"
kind = "source"
repo = "ggml-org/llama.cpp"
dir = "~/llama.cpp"
move = "ff"
check = ["sh", "-c", '''"$HOME/.local/bin/llama-server" --version 2>&1 | grep -oP 'commit \K[0-9a-f]+' ''']
commit = ["sh", "-c", '''"$HOME/.local/bin/llama-server" --version 2>&1 | grep -oP 'commit \K[0-9a-f]+' ''']
stage = "~/llama.cpp/build-upkeep-{tag}"
needs = [
	"sh",
	"-c",
	'''ldd "$HOME/.local/bin/llama-server" | awk '/libggml-cuda/ {print $3}' | xargs dirname | xargs dirname''',
]
prune = ["~/llama.cpp/build-86real-new*", "~/llama.cpp/build-upkeep-*"]
build = [
	'''arch=$(grep '^CMAKE_CUDA_ARCHITECTURES:' "{needs}/CMakeCache.txt" | cut -d= -f2); test -n "$arch" || { echo "no CUDA arch in {needs}/CMakeCache.txt"; exit 1; }; cmake -S . -B {stage} -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES="$arch" -DGGML_CUDA_F16=ON -DGGML_CUDA_FA_ALL_QUANTS=ON -DGGML_NATIVE=ON -DGGML_CUDA_NO_VMM=ON''',
	"cmake --build {stage} -j 6 --target llama-server",
]
check_built = ['''{stage}/bin/llama-server --version 2>&1 | grep -q '^version:' ''']
place = [{ from = "{stage}/bin/llama-server", to = "~/.local/bin/llama-server" }]
busy = [
	{ process = "ComfyUI/main.py", say = "ComfyUI is running a job." },
	{ run = [
		"sh",
		"-c",
		'''grep -lqsE '"status": *"(queued|processing)"' "$HOME"/.local/share/sd-api/queue/*.json''',
	], say = "The image queue has a job waiting." },
]
pause = [
	{ name = "sd-api.service", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"sd-api.service",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"sd-api.service",
	], start = [
		"systemctl",
		"--user",
		"start",
		"sd-api.service",
	] },
	{ name = "strata-watchdog.timer", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"strata-watchdog.timer",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"strata-watchdog.timer",
	], start = [
		"systemctl",
		"--user",
		"start",
		"strata-watchdog.timer",
	] },
	{ name = "strata-watchdog.service", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"strata-watchdog.service",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"strata-watchdog.service",
	] },
]
note = "Updating restarts the llama-server services that are running."

[[apps.llama.serve]]
name = "llama-server"
active = ["systemctl", "is-active", "--quiet", "llama-server"]
stop = ["sudo", "systemctl", "stop", "llama-server"]
start = ["sudo", "systemctl", "start", "llama-server"]
since = ["systemctl", "show", "-p", "ActiveEnterTimestampMonotonic", "--value", "llama-server"]
health = "http://127.0.0.1:8080/health"
wait_s = 120

[[apps.llama.serve.test]]
name = "a short generation"
url = "http://127.0.0.1:8080/completion"
body = '{"model":"local-llm","prompt":"Write a Python function that reverses a linked list.","n_predict":200,"cache_prompt":false}'
expect = '"predicted_n"'
timeout_s = 120

[[apps.llama.serve]]
name = "strata-embed"
active = ["systemctl", "is-active", "--quiet", "strata-embed"]
stop = ["sudo", "systemctl", "stop", "strata-embed"]
start = ["sudo", "systemctl", "start", "strata-embed"]
since = ["systemctl", "show", "-p", "ActiveEnterTimestampMonotonic", "--value", "strata-embed"]
health = "http://127.0.0.1:8181/health"
wait_s = 60

[[apps.llama.serve.test]]
name = "an embedding"
url = "http://127.0.0.1:8181/v1/embeddings"
body = '{"model":"bge-m3","input":"hi"}'
expect = '"embedding"'
timeout_s = 30

[apps.comfyui]
name = "ComfyUI"
kind = "source"
repo = "comfyanonymous/ComfyUI"
dir = "~/repos/ComfyUI"
move = "reset"
check = [
	"sh",
	"-c",
	'''[ -d "$HOME/repos/ComfyUI/.git" ] || exit 127; grep -oP '__version__ = "\K[^"]+' "$HOME/repos/ComfyUI/comfyui_version.py" 2>/dev/null''',
]
busy = [
	{ process = "ComfyUI/main.py", say = "ComfyUI is running a job." },
	{ run = [
		"sh",
		"-c",
		'''grep -lqsE '"status": *"(queued|processing)"' "$HOME"/.local/share/sd-api/queue/*.json''',
	], say = "The image queue has a job waiting." },
]
pause = [
	{ name = "sd-api.service", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"sd-api.service",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"sd-api.service",
	], start = [
		"systemctl",
		"--user",
		"start",
		"sd-api.service",
	] },
]
record = [
	{ file = "pip-freeze.txt", run = [
		"venv/bin/pip",
		"freeze",
	] },
	{ file = "custom-nodes.txt", run = [
		"sh",
		"-c",
		'''for d in custom_nodes/*/; do if [ -d "$d/.git" ]; then echo "$d $(git -C "$d" rev-parse HEAD)"; fi; done''',
	] },
	{ file = "wheels.log", run = [
		"sh",
		"-c",
		'''set -e; p="{point}"; git show {tag}:requirements.txt > "$p/requirements.new.txt"; venv/bin/pip install -q --dry-run --report "$p/plan.json" -r "$p/requirements.new.txt" --extra-index-url https://download.pytorch.org/whl/cu130; venv/bin/python -c 'import json,sys; p=sys.argv[1]; plan={i["metadata"]["name"].lower() for i in json.load(open(p+"/plan.json"))["install"]}; old={l.split("==")[0].lower():l.strip() for l in open(p+"/pip-freeze.txt") if "==" in l}; open(p+"/old-pins.txt","w").write("".join(old[n]+"\n" for n in plan if n in old)); open(p+"/added.txt","w").write("".join(n+"\n" for n in plan if n not in old))' "$p"; if [ -s "$p/old-pins.txt" ]; then venv/bin/pip download -q --no-deps -d "$p/wheels" -r "$p/old-pins.txt" --extra-index-url https://download.pytorch.org/whl/cu130; fi''',
	] },
]
build = [
	"venv/bin/pip install -q -r requirements.txt",
	'''for d in custom_nodes/*/; do [ -d "$d/.git" ] || continue; git -C "$d" pull -q --ff-only 2>/dev/null || echo "$d: pull skipped"; if [ -f "$d/requirements.txt" ]; then venv/bin/pip install -q -r "$d/requirements.txt" || exit 1; fi; done''',
]
undo = [
	'''while read -r d h; do git -C "$d" checkout -q "$h"; done < "{point}/custom-nodes.txt"''',
	'''if [ -s "{point}/added.txt" ]; then venv/bin/pip uninstall -q -y -r "{point}/added.txt"; fi; if [ -s "{point}/old-pins.txt" ]; then venv/bin/pip install -q --no-index --find-links "{point}/wheels" -r "{point}/old-pins.txt"; fi''',
]
test = [
	{ name = "every node pack loads", run = [
		"timeout",
		"600",
		"venv/bin/python",
		"main.py",
		"--quick-test-for-ci",
		"--cpu",
	], fail_on = "IMPORT FAILED|Traceback", timeout_s = 660 },
	{ name = "torch still sees CUDA", run = [
		"venv/bin/python",
		"-c",
		"import torch; assert torch.cuda.is_available()",
	], timeout_s = 120 },
]
note = "Updating pauses the image queue (sd-api) for a few minutes."

[apps.dsh]
name = "dsh"
kind = "source"
latest = "npm-tags:@deepseek-ai/dsh"
check = [
	"sh",
	"-c",
	'''grep -oP '"version": *"\K[^"]+' "$HOME/.local/share/dsh/lib/node_modules/@deepseek-ai/dsh/package.json" | head -1''',
]
stage = "~/.local/share/dsh.upkeep-next"
build = ["npm install -g --prefix {stage} @deepseek-ai/dsh@{version}"]
check_built = [
	"/usr/bin/node {stage}/lib/node_modules/@deepseek-ai/dsh/lib/bin.js --profile headless --dump-config >/dev/null",
	'''echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"clientCapabilities":{"fs":{"readTextFile":false,"writeTextFile":false}}}}' | timeout 60 /usr/bin/node {stage}/lib/node_modules/@deepseek-ai/dsh/lib/bin.js --profile acp 2>/dev/null | grep -q '"result"' ''',
]
busy = [{ process = "share/dsh/lib/node_modules", say = "dsh is running outside dsh web.", when = "stopped" }]
place = [{ from = "{stage}", to = "~/.local/share/dsh" }]
test = [
	{ name = "headless profile", run = [
		"sh",
		"-c",
		"~/.local/bin/dsh --profile headless --dump-config >/dev/null",
	], timeout_s = 60 },
	{ name = "ACP initialize", run = [
		"sh",
		"-c",
		'''echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"clientCapabilities":{"fs":{"readTextFile":false,"writeTextFile":false}}}}' | timeout 60 ~/.local/bin/dsh-alpha --profile acp 2>/dev/null | grep -q '"result"' ''',
	], timeout_s = 70 },
]
note = "Updating restarts dsh web, which ends every session running in it."

[[apps.dsh.serve]]
name = "dsh-web.service"
active = ["systemctl", "--user", "is-active", "--quiet", "dsh-web.service"]
stop = ["systemctl", "--user", "stop", "dsh-web.service"]
start = ["systemctl", "--user", "start", "dsh-web.service"]
since = ["systemctl", "--user", "show", "-p", "ActiveEnterTimestampMonotonic", "--value", "dsh-web.service"]
health = "http://127.0.0.1:3080/"
status = 401
wait_s = 60

[apps.strata]
name = "Strata"
kind = "source"
repo = "Niko1221/Strata"
dir = "~/Projects/Strata"
move = "ff"
check = [
	"sh",
	"-c",
	'''git -C "$HOME/Projects/Strata" describe --tags --abbrev=0 HEAD 2>/dev/null | sed 's/^v//; s/-.*//' ''',
]
commit = ["git", "-C", "~/Projects/Strata", "rev-parse", "HEAD"]
# Strata 0.2.16 moved what setup writes (.venv, the run configs, the built engine) from the clone's root into
# terminal/, and its setup moves an older clone's copies there once. A restore point has to hold both places: one
# taken on 0.2.15 rolls back to the root copies, one taken later to terminal/. A path that is not there is skipped.
keep = [".venv", "engine", "strata-*.json", "terminal/.venv", "terminal/engine", "terminal/strata-*.json"]
# setup copies the new engine over the one the service runs, which Linux refuses while it runs ("text file busy").
hold = ["engine", "terminal/engine"]
# setup.sh --update pulls the branch tip itself; STRATA_UPDATE_PULLED keeps it on the tag Upkeep moved to. The run
# configs sit beside the launcher's bin/, so the active-config link is found the same way in either layout.
build = [
	'''export STRATA_UPDATE_PULLED=1
d=$(dirname "$(dirname "$(git ls-files -- bin/strata '*/bin/strata' | head -n 1)")")
t=$(readlink "$d/strata-active.json" || readlink strata-active.json) || exit 1
rm -f strata-active.json "$d/strata-active.json"
sh ./setup.sh --update
rc=$?
ln -sfn "$t" "$d/strata-active.json"
exit $rc''',
]
# Strata's own CLI checks the build: the version it reports, then strata doctor on the active run config, whose engine
# must be the one just built from this source. Without the launcher, a built engine must match the source version.
# The second step reads the unit itself: every file its start line names must still be there after the build.
# A unit that names paths inside the checkout breaks on every layout move, and pointing it at the new paths first
# breaks the version still running. Start it through a script outside the checkout that finds the layout, e.g.
#   cd ~/Projects/Strata || exit 1; [ -f terminal/setup.py ] && cd terminal
#   exec .venv/bin/python serve/server.py --engine strata --config strata-active.json --port 8092
# with the unit's ExecStart set to that script (a drop-in in /etc/systemd/system/strata.service.d/).
check_built = [
	'''cli=$(git ls-files -- bin/strata '*/bin/strata' | head -n 1)
if [ -z "$cli" ]; then
	echo "This checkout has no bin/strata launcher, so the engine files are checked instead."
	cv=$(grep -h -oP 'project\(strata VERSION \K[0-9.]+' CMakeLists.txt engine/CMakeLists.txt 2>/dev/null | head -n 1)
	[ -n "$cv" ] || { echo "No engine source version found."; exit 1; }
	for f in engine/BUILD.json */engine/BUILD.json; do
		grep -qs "\"version\": *\"$cv\"" "$f" && exit 0
	done
	echo "No built engine is version $cv."
	exit 1
fi
v=$("./$cli" --version 2>&1) || { echo "strata --version failed: $v"; exit 1; }
case "$v" in
	"strata {version} (build "*) ;;
	*) echo "strata --version says $v, not {version}."; exit 1 ;;
esac
b=$(echo "$v" | sed -n 's/.*(build \([^;]*\);.*/\1/p')
"./$cli" doctor --profile "$(dirname "$(dirname "$cli")")/strata-active.json" --output json | python3 -c '
import json, sys
r = json.load(sys.stdin)["report"]
e = [c for c in r["components"] if c["name"] == "engine"][0]
bad = [i["message"] + " (" + i.get("component", i["code"]) + ")" for i in r["issues"] if i["severity"] == "error"]
if e.get("version") != sys.argv[1]:
    bad.append("the engine is " + str(e.get("version")) + ", its source " + sys.argv[1])
print("strata doctor: " + ("; ".join(bad) if bad else "ok, engine " + sys.argv[1]))
sys.exit(1 if bad else 0)
' "$b"''',
	'''w=$(systemctl show -p WorkingDirectory --value strata | sed 's/^[-!]*//')
a=$(systemctl show -p ExecStart --value strata | sed -n 's/.*argv\[\]=\([^;]*\);.*/\1/p')
cd "${w:-.}" || exit 1
for x in $a; do
	case "$x" in
		-*) continue ;;
		*/* | *.py | *.json) ;;
		*) continue ;;
	esac
	[ -e "$x" ] || { echo "strata.service starts with $x, which this build moved: start the unit through a script that finds the layout (see the Strata example in manifest/examples.toml)."; exit 1; }
done''',
]
config = [
	{ file = "terminal/strata-*.json", key = "host", value = "127.0.0.1" },
	{ file = "terminal/strata-*.json", key = "port", value = 8092 },
	{ file = "terminal/strata-*.json", array = "args", flag = "--max-context", value = "262144" },
	{ file = "terminal/strata-*.json", array = "args", flag = "--vram-reserve-mib", value = "1800" },
]
busy = [
	{ process = "ComfyUI/main.py", say = "ComfyUI is running a job." },
	{ run = [
		"sh",
		"-c",
		'''grep -lqsE '"status": *"(queued|processing)"' "$HOME"/.local/share/sd-api/queue/*.json''',
	], say = "The image queue has a job waiting." },
]
pause = [
	{ name = "sd-api.service", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"sd-api.service",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"sd-api.service",
	], start = [
		"systemctl",
		"--user",
		"start",
		"sd-api.service",
	] },
	{ name = "strata-watchdog.timer", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"strata-watchdog.timer",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"strata-watchdog.timer",
	], start = [
		"systemctl",
		"--user",
		"start",
		"strata-watchdog.timer",
	] },
	{ name = "strata-watchdog.service", active = [
		"systemctl",
		"--user",
		"is-active",
		"--quiet",
		"strata-watchdog.service",
	], stop = [
		"systemctl",
		"--user",
		"stop",
		"strata-watchdog.service",
	] },
]
note = "Updating restarts Strata, which takes a minute or two to load the model."

[[apps.strata.serve]]
name = "strata"
active = ["systemctl", "is-active", "--quiet", "strata"]
stop = ["sudo", "systemctl", "stop", "strata"]
start = ["sudo", "systemctl", "start", "strata"]
since = ["systemctl", "show", "-p", "ActiveEnterTimestampMonotonic", "--value", "strata"]
health = "http://127.0.0.1:8080/health"
expect = '"loaded": true'
wait_s = 300

[[apps.strata.serve.test]]
name = "a cold generation"
url = "http://127.0.0.1:8080/v1/chat/completions"
body = '{"model":"local-llm","messages":[{"role":"user","content":"Write a Python function that reverses a linked list."}],"max_tokens":300,"reasoning_effort":"none"}'
expect = '"completion_tokens"'
timeout_s = 120

[[apps.strata.serve.test]]
name = "a warm generation"
url = "http://127.0.0.1:8080/v1/chat/completions"
body = '{"model":"local-llm","messages":[{"role":"user","content":"Write a Python function that reverses a linked list."}],"max_tokens":300,"reasoning_effort":"none"}'
expect = '"completion_tokens"'
timeout_s = 120

[[apps.strata.serve.test]]
name = "embeddings"
url = "http://127.0.0.1:8080/v1/embeddings"
body = '{"model":"bge-m3","input":"hi"}'
expect = '"embedding"'
timeout_s = 30
required = false
