# Drafted from stacklok/frizbee's v0.1.11 release; its version is the one Upkeep installed.
[apps.frizbee]
name = "frizbee"
kind = "archive"
repo = "stacklok/frizbee"
asset = '^frizbee_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^frizbee_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/frizbee"
bins = ["frizbee"]
probe = false
