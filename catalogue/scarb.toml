# Drafted from software-mansion/scarb's v2.21.0 release; its version is the one Upkeep installed.
[apps.scarb]
name = "scarb"
kind = "archive"
repo = "software-mansion/scarb"
asset = '^scarb-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^scarb-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/scarb"
folder = "~/.local/share/scarb"
bins = ["bin/scarb", "bin/scarb-cairo-language-server", "bin/scarb-cairo-test", "bin/scarb-doc", "bin/scarb-execute", "bin/scarb-mdbook"]
probe = false
