# The version is read from the AppImage's own .desktop file (X-AppImage-Version): an Electron or Flutter app opens its window when asked for --version.
[apps.motrix]
name = "Motrix"
kind = "appimage"
repo = "agalwood/Motrix"
asset = '^Motrix-[0-9.]+-x86_64\.AppImage$'
asset_aarch64 = '^Motrix-[0-9.]+-arm64\.AppImage$'
dest = "~/.local/bin/motrix.AppImage"
meta_path = "motrix.desktop"
process = "motrix"
relaunch = true
