# Drafted from g-plane/pnpm-shell-completion's v0.5.5 release; its version is the one Upkeep installed.
[apps.pnpm-shell-completion]
name = "Pnpm Shell Completion"
kind = "archive"
repo = "g-plane/pnpm-shell-completion"
asset = '^pnpm-shell-completion_x86_64-unknown-linux-gnu\.zip$'
asset_aarch64 = '^pnpm-shell-completion_aarch64-unknown-linux-gnu\.zip$'
dest = "~/.local/bin/pnpm-shell-completion"
bins = ["pnpm-shell-completion"]
probe = false
