# Drafted from apache/camel-k's v2.11.0 release; its version is the one Upkeep installed.
[apps.kamel]
name = "Camel K"
kind = "archive"
repo = "apache/camel-k"
asset = '^camel-k-client-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^camel-k-client-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/kamel"
folder = "~/.local/share/kamel"
bins = ["kamel"]
probe = false
