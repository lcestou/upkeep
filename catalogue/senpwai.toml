# Drafted from SenZmaKi/Senpwai's v3.0.1 release; its version is the one Upkeep installed.
[apps.senpwai]
name = "Senpwai"
kind = "appimage"
repo = "SenZmaKi/Senpwai"
asset = '^Senpwai-.*-x86_64\.AppImage$'
asset_aarch64 = '^Senpwai-.*-aarch64\.AppImage$'
dest = "~/.local/bin/senpwai.AppImage"
probe = false
