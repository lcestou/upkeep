# Drafted from pete911/certinfo's v1.0.41 release; its version is the one Upkeep installed.
[apps.certinfo]
name = "certinfo"
kind = "archive"
repo = "pete911/certinfo"
asset = '^certinfo_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^certinfo_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/certinfo"
bins = ["certinfo"]
probe = false
