# Drafted from cert-manager/cmctl's v2.6.2 release; its version is the one Upkeep installed.
[apps.cmctl]
name = "cmctl"
kind = "archive"
repo = "cert-manager/cmctl"
asset = '^cmctl_linux_amd64\.tar\.gz$'
asset_aarch64 = '^cmctl_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/cmctl"
bins = ["cmctl"]
probe = false
