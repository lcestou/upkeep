# Drafted from elsesiy/kubectl-view-secret's v0.17.0 release; its version is the one Upkeep installed.
[apps.kubectl-view-secret]
name = "Kubectl View Secret"
kind = "archive"
repo = "elsesiy/kubectl-view-secret"
asset = '^kubectl-view-secret_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kubectl-view-secret_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubectl-view-secret"
bins = ["kubectl-view-secret"]
probe = false
