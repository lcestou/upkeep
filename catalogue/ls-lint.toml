# Drafted from loeffel-io/ls-lint's v2.3.2 release; its version is the one Upkeep installed.
[apps.ls-lint]
name = "Ls Lint"
kind = "archive"
repo = "loeffel-io/ls-lint"
asset = '^ls-lint-linux-amd64\.tar\.gz$'
asset_aarch64 = '^ls-lint-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/ls-lint"
bins = ["ls-lint*"]
probe = false
