# Drafted from UniClipboard/UniClipboard's v1.6.2 release; its version is the one Upkeep installed.
[apps.uniclipboard]
name = "UniClipboard"
kind = "appimage"
repo = "UniClipboard/UniClipboard"
asset = '^UniClipboard_.*_amd64\.AppImage$'
asset_aarch64 = '^UniClipboard_.*_aarch64\.AppImage$'
dest = "~/.local/bin/uniclipboard.AppImage"
probe = false
