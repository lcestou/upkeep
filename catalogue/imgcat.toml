# Drafted from danielgatis/imgcat's v1.0.23 release; its version is the one Upkeep installed.
[apps.imgcat]
name = "imgcat"
kind = "archive"
repo = "danielgatis/imgcat"
asset = '^imgcat_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^imgcat_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/imgcat"
bins = ["imgcat"]
probe = false
