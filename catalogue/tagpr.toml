# Drafted from Songmu/tagpr's v1.22.0 release; its version is the one Upkeep installed.
[apps.tagpr]
name = "tagpr"
kind = "archive"
repo = "Songmu/tagpr"
asset = '^tagpr_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tagpr_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tagpr"
folder = "~/.local/share/tagpr"
bins = ["tagpr"]
probe = false
