# Drafted from savedra1/clipse's v1.2.1 release; its version is the one Upkeep installed.
[apps.clipse]
name = "clipse"
kind = "archive"
repo = "savedra1/clipse"
asset = '^clipse_.*_linux_x11_amd64\.tar\.gz$'
asset_aarch64 = '^clipse_.*_linux_x11_arm64\.tar\.gz$'
dest = "~/.local/bin/clipse"
bins = ["clipse*"]
probe = false
