# Drafted from VirusTotal/yara-x's v1.23.0 release; its version is the one Upkeep installed.
[apps.yr]
name = "Yara X"
kind = "archive"
repo = "VirusTotal/yara-x"
asset = '^yara-x-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^yara-x-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/yr"
bins = ["yr"]
probe = false
