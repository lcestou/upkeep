# Drafted from remoteoss/dexter's v0.7.2 release; its version is the one Upkeep installed.
[apps.dexter]
name = "dexter"
kind = "archive"
repo = "remoteoss/dexter"
asset = '^dexter_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^dexter_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/dexter"
bins = ["dexter_Linux_x86_64/dexter"]
probe = false
