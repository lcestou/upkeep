# Drafted from truffleruby/truffleruby's graal-40.0.0 release.
[apps.truffleruby]
name = "truffleruby"
kind = "archive"
repo = "truffleruby/truffleruby"
asset = '^truffleruby-[0-9][0-9A-Za-z.]*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^truffleruby-[0-9][0-9A-Za-z.]*-linux-aarch64\.tar\.gz$'
dest = "~/.local/bin/truffleruby"
folder = "~/.local/share/truffleruby"
bins = ["bin/truffleruby", "bin/truffleruby-polyglot-get"]
