# Drafted from jorgerojas26/lazysql's v0.7.0 release; its version is the one Upkeep installed.
[apps.lazysql]
name = "lazysql"
kind = "archive"
repo = "jorgerojas26/lazysql"
asset = '^lazysql_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^lazysql_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/lazysql"
bins = ["lazysql"]
probe = false
