# Drafted from makiuchi-d/arelo's v1.15.4 release; its version is the one Upkeep installed.
[apps.arelo]
name = "arelo"
kind = "archive"
repo = "makiuchi-d/arelo"
asset = '^arelo_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^arelo_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/arelo"
bins = ["arelo"]
probe = false
