# Drafted from Gentleman-Programming/gentle-ai's v4.5.0 release; its version is the one Upkeep installed.
[apps.gentle-ai]
name = "Gentle Ai"
kind = "archive"
repo = "Gentleman-Programming/gentle-ai"
asset = '^gentle-ai_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^gentle-ai_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gentle-ai"
folder = "~/.local/share/gentle-ai"
bins = ["gentle-ai"]
probe = false
