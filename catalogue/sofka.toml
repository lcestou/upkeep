# Drafted from nklmilojevic/sofka's v0.35.1 release; its version is the one Upkeep installed.
[apps.sofka]
name = "sofka"
kind = "archive"
repo = "nklmilojevic/sofka"
asset = '^sofka-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^sofka-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/sofka"
folder = "~/.local/share/sofka"
bins = ["sofka"]
probe = false
