# Drafted from unmojang/FjordLauncher's 11.1.1.0 release; its version is the one Upkeep installed.
[apps.fjordlauncher]
name = "FjordLauncher"
kind = "appimage"
repo = "unmojang/FjordLauncher"
asset = '^FjordLauncher-Linux-x86_64\.AppImage$'
asset_aarch64 = '^FjordLauncher-Linux-aarch64\.AppImage$'
dest = "~/.local/bin/fjordlauncher.AppImage"
probe = false
