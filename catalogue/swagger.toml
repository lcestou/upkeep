# Drafted from go-swagger/go-swagger's v0.36.7 release; its version is the one Upkeep installed.
[apps.swagger]
name = "Go Swagger"
kind = "archive"
repo = "go-swagger/go-swagger"
asset = '^swagger_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^swagger_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/swagger"
bins = ["swagger"]
probe = false
