# Drafted from hashicorp/copywrite's v0.25.3 release; its version is the one Upkeep installed.
[apps.copywrite]
name = "copywrite"
kind = "archive"
repo = "hashicorp/copywrite"
asset = '^copywrite_.*_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^copywrite_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/copywrite"
folder = "~/.local/share/copywrite"
bins = ["copywrite"]
probe = false
