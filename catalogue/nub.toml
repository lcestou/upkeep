# Drafted from nubjs/nub's v0.11.0 release; its version is the one Upkeep installed.
[apps.nub]
name = "nub"
kind = "archive"
repo = "nubjs/nub"
asset = '^nub-linux-x64-musl\.tar\.gz$'
asset_aarch64 = '^nub-linux-arm64-musl\.tar\.gz$'
dest = "~/.local/bin/nub"
folder = "~/.local/share/nub"
bins = ["nub", "nub-launcher-linux-x64-musl"]
probe = false
