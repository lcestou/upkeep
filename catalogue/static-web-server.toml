# Drafted from static-web-server/static-web-server's v2.44.2 release; its version is the one Upkeep installed.
[apps.static-web-server]
name = "Static Web Server"
kind = "archive"
repo = "static-web-server/static-web-server"
asset = '^static-web-server-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^static-web-server-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/static-web-server"
bins = ["static-web-server-v2.44.2-x86_64-unknown-linux-gnu/static-web-server"]
probe = false
