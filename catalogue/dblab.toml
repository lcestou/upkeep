# Drafted from danvergara/dblab's v0.55.2 release; its version is the one Upkeep installed.
[apps.dblab]
name = "dblab"
kind = "archive"
repo = "danvergara/dblab"
asset = '^dblab_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^dblab_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/dblab"
bins = ["dblab"]
probe = false
