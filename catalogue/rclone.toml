# Drafted from rclone/rclone's v1.76.0 release; its version is the one Upkeep installed.
[apps.rclone]
name = "rclone"
kind = "archive"
repo = "rclone/rclone"
asset = '^rclone-.*-linux-amd64\.zip$'
asset_aarch64 = '^rclone-.*-linux-arm64\.zip$'
dest = "~/.local/bin/rclone"
bins = ["rclone-v1.76.0-linux-amd64/rclone"]
probe = false
