# Drafted from samwho/spacer's v0.5.0 release; its version is the one Upkeep installed.
[apps.spacer]
name = "spacer"
kind = "archive"
repo = "samwho/spacer"
asset = '^spacer-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^spacer-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/spacer"
bins = ["spacer"]
probe = false
