# Drafted from MusicDin/kubitect's v3.6.0 release; its version is the one Upkeep installed.
[apps.kubitect]
name = "kubitect"
kind = "archive"
repo = "MusicDin/kubitect"
asset = '^kubitect-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^kubitect-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/kubitect"
bins = ["kubitect"]
probe = false
