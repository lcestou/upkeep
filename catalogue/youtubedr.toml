# Drafted from kkdai/youtube's v2.10.8 release; its version is the one Upkeep installed.
[apps.youtubedr]
name = "youtube"
kind = "archive"
repo = "kkdai/youtube"
asset = '^youtubedr_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^youtubedr_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/youtubedr"
bins = ["youtubedr"]
probe = false
