# Drafted from txn2/kubefwd's v1.25.18 release; its version is the one Upkeep installed.
[apps.kubefwd]
name = "kubefwd"
kind = "archive"
repo = "txn2/kubefwd"
asset = '^kubefwd_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^kubefwd_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubefwd"
bins = ["kubefwd"]
probe = false
