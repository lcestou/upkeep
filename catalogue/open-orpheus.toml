# Drafted from YUCLing/open-orpheus's v0.20.0 release; its version is the one Upkeep installed.
[apps.open-orpheus]
name = "Open Orpheus"
kind = "appimage"
repo = "YUCLing/open-orpheus"
asset = '^open-orpheus-.*-x86_64\.AppImage$'
asset_aarch64 = '^open-orpheus-.*-aarch64\.AppImage$'
dest = "~/.local/bin/open-orpheus.AppImage"
probe = false
