# Drafted from FairwindsOps/reckoner's v6.3.0 release.
[apps.reckoner]
name = "reckoner"
kind = "archive"
repo = "FairwindsOps/reckoner"
asset = '^reckoner_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^reckoner_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/reckoner"
bins = ["reckoner"]
version_args = ["version"]
