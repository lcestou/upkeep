# Drafted from ThinkInAIXYZ/deepchat's v1.1.4 release; its version is the one Upkeep installed.
[apps.deepchat]
name = "DeepChat"
kind = "appimage"
repo = "ThinkInAIXYZ/deepchat"
asset = '^DeepChat-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^DeepChat-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/deepchat.AppImage"
probe = false
