# Drafted from meta/dotslash's v0.5.9 release; its version is the one Upkeep installed.
[apps.dotslash]
name = "dotslash"
kind = "archive"
repo = "meta/dotslash"
asset = '^dotslash-linux-musl\.x86_64\.tar\.gz$'
asset_aarch64 = '^dotslash-linux-musl\.aarch64\.tar\.gz$'
dest = "~/.local/bin/dotslash"
bins = ["dotslash"]
probe = false
