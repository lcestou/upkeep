# Drafted from lusingander/ddv's v0.3.1 release; its version is the one Upkeep installed.
[apps.ddv]
name = "ddv"
kind = "archive"
repo = "lusingander/ddv"
asset = '^ddv-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^ddv-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/ddv"
bins = ["ddv"]
probe = false
