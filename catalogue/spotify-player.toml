# Drafted from aome510/spotify-player's v0.25.2 release; its version is the one Upkeep installed.
[apps.spotify-player]
name = "Spotify Player"
kind = "archive"
repo = "aome510/spotify-player"
asset = '^spotify_player-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^spotify_player-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/spotify_player"
bins = ["spotify_player"]
probe = false
