# Drafted from storytold/gridcraft's v0.19.1 release; its version is the one Upkeep installed.
[apps.gridcraft]
name = "gridcraft"
kind = "appimage"
repo = "storytold/gridcraft"
asset = '^gridcraft-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^gridcraft-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/gridcraft.AppImage"
probe = false
