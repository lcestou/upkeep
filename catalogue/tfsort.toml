# Drafted from AlexNabokikh/tfsort's v0.7.5 release; its version is the one Upkeep installed.
[apps.tfsort]
name = "tfsort"
kind = "archive"
repo = "AlexNabokikh/tfsort"
asset = '^tfsort_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tfsort_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tfsort"
bins = ["tfsort"]
probe = false
