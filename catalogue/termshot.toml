# Drafted from homeport/termshot's v0.6.1 release; its version is the one Upkeep installed.
[apps.termshot]
name = "termshot"
kind = "archive"
repo = "homeport/termshot"
asset = '^termshot_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^termshot_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/termshot"
bins = ["termshot"]
probe = false
