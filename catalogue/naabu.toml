# Drafted from projectdiscovery/naabu's v2.7.0 release; its version is the one Upkeep installed.
[apps.naabu]
name = "naabu"
kind = "archive"
repo = "projectdiscovery/naabu"
asset = '^naabu_.*_linux_amd64_musl\.zip$'
asset_aarch64 = '^naabu_.*_linux_arm64_musl\.zip$'
dest = "~/.local/bin/naabu"
bins = ["naabu"]
probe = false
