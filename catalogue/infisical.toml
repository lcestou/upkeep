# Drafted from Infisical/cli's v0.45.8 release.
[apps.infisical]
name = "Infisical"
kind = "archive"
repo = "Infisical/cli"
asset = '^cli_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^cli_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/infisical"
folder = "~/.local/share/infisical"
bins = ["infisical"]
