# Drafted from j178/prek's v0.5.10 release; its version is the one Upkeep installed.
[apps.prek]
name = "prek"
kind = "archive"
repo = "j178/prek"
asset = '^prek-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^prek-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/prek"
bins = ["prek-x86_64-unknown-linux-gnu/prek"]
probe = false
