# Drafted from slackhq/nebula's v1.12.0 release; its version is the one Upkeep installed.
[apps.nebula]
name = "nebula"
kind = "archive"
repo = "slackhq/nebula"
asset = '^nebula-linux-amd64\.tar\.gz$'
asset_aarch64 = '^nebula-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/nebula"
bins = ["nebula", "nebula-cert"]
probe = false
