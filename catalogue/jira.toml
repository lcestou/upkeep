# Drafted from ankitpokhrel/jira-cli's v1.7.0 release.
[apps.jira]
name = "Jira Cli"
kind = "archive"
repo = "ankitpokhrel/jira-cli"
asset = '^jira_.*_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^jira_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/jira"
bins = ["jira_1.7.0_linux_x86_64/bin/jira"]
version_args = ["version"]
