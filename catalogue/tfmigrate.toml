# Drafted from minamijoyo/tfmigrate's v0.4.6 release; its version is the one Upkeep installed.
[apps.tfmigrate]
name = "tfmigrate"
kind = "archive"
repo = "minamijoyo/tfmigrate"
asset = '^tfmigrate_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tfmigrate_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tfmigrate"
bins = ["tfmigrate"]
probe = false
