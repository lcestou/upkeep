# Drafted from openchamber/openchamber's v2.7.2 release; its version is the one Upkeep installed.
[apps.openchamber]
name = "OpenChamber"
kind = "appimage"
repo = "openchamber/openchamber"
asset = '^OpenChamber-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^OpenChamber-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/openchamber.AppImage"
probe = false
