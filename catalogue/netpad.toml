# Drafted from tareqimbasher/NetPad's v0.12.0 release; its version is the one Upkeep installed.
[apps.netpad]
name = "NetPad"
kind = "appimage"
repo = "tareqimbasher/NetPad"
asset = '^netpad-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^netpad-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/netpad.AppImage"
probe = false
