# Drafted from watchexec/watchexec's v2.8.0 release; its version is the one Upkeep installed.
[apps.watchexec]
name = "watchexec"
kind = "archive"
repo = "watchexec/watchexec"
asset = '^watchexec-.*-x86_64-unknown-linux-gnu\.tar\.xz$'
asset_aarch64 = '^watchexec-.*-aarch64-unknown-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/watchexec"
folder = "~/.local/share/watchexec"
bins = ["watchexec"]
probe = false
