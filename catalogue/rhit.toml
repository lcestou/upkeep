# Drafted from Canop/rhit's v2.0.4 release; its version is the one Upkeep installed.
[apps.rhit]
name = "rhit"
kind = "archive"
repo = "Canop/rhit"
asset = '^rhit_.*\.zip$'
dest = "~/.local/bin/rhit"
folder = "~/.local/share/rhit"
bins = ["aarch64-unknown-linux-gnu/rhit", "aarch64-unknown-linux-musl/rhit", "armv7-unknown-linux-gnueabihf/rhit", "armv7-unknown-linux-musleabi/rhit", "x86_64-linux/rhit", "x86_64-unknown-linux-gnu/rhit"]
probe = false
