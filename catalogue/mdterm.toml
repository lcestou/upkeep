# Drafted from bahdotsh/mdterm's v2.0.0 release; its version is the one Upkeep installed.
[apps.mdterm]
name = "mdterm"
kind = "archive"
repo = "bahdotsh/mdterm"
asset = '^mdterm-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^mdterm-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/mdterm"
bins = ["mdterm"]
probe = false
