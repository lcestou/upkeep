# Drafted from Epistates/treemd's v0.10.0 release; its version is the one Upkeep installed.
[apps.treemd]
name = "treemd"
kind = "archive"
repo = "Epistates/treemd"
asset = '^treemd-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^treemd-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/treemd"
bins = ["treemd*"]
probe = false
