# Drafted from andrei-drexler/ironwail's v0.8.2 release; its version is the one Upkeep installed.
[apps.ironwail]
name = "ironwail"
kind = "archive"
repo = "andrei-drexler/ironwail"
asset = '^ironwail-.*-linux-x64\.tar\.gz$'
dest = "~/.local/bin/ironwail"
folder = "~/.local/share/ironwail"
bins = ["ironwail"]
probe = false
