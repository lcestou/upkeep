# Drafted from rui314/mold's v3.0.0 release; its version is the one Upkeep installed.
[apps.mold]
name = "mold"
kind = "archive"
repo = "rui314/mold"
asset = '^mold-.*-x86_64-linux\.tar\.gz$'
asset_aarch64 = '^mold-.*-aarch64-linux\.tar\.gz$'
dest = "~/.local/bin/mold"
folder = "~/.local/share/mold"
bins = ["bin/mold"]
probe = false
