# Drafted from nathanialf/ico-pc's v0.11.6 release; its version is the one Upkeep installed.
[apps.ico]
name = "Ico Pc"
kind = "appimage"
repo = "nathanialf/ico-pc"
asset = '^ico-pc-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^ico-pc-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/ico.AppImage"
probe = false
