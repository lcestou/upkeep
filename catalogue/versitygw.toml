# Drafted from versity/versitygw's v1.11.0 release; its version is the one Upkeep installed.
[apps.versitygw]
name = "versitygw"
kind = "archive"
repo = "versity/versitygw"
asset = '^versitygw_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^versitygw_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/versitygw"
bins = ["versitygw_v1.11.0_Linux_x86_64/versitygw"]
probe = false
