# Drafted from x90skysn3k/brutespray's v2.7.5 release; its version is the one Upkeep installed.
[apps.brutespray]
name = "brutespray"
kind = "archive"
repo = "x90skysn3k/brutespray"
asset = '^brutespray_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^brutespray_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/brutespray"
bins = ["brutespray"]
probe = false
