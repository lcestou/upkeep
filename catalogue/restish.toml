# Drafted from rest-sh/restish's v2.3.0 release.
[apps.restish]
name = "restish"
kind = "archive"
repo = "rest-sh/restish"
asset = '^restish-[0-9][0-9A-Za-z.]*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^restish-[0-9][0-9A-Za-z.]*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/restish"
bins = ["restish"]
