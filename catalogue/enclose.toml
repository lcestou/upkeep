# Drafted from enclosedev/enclose's v0.0.25 release; its version is the one Upkeep installed.
[apps.enclose]
name = "Enclose"
kind = "appimage"
repo = "enclosedev/enclose"
asset = '^Enclose-.*-x86_64\.AppImage$'
asset_aarch64 = '^Enclose-.*-arm64\.AppImage$'
dest = "~/.local/bin/enclose.AppImage"
probe = false
