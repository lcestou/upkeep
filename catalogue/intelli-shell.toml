# Drafted from lasantosr/intelli-shell's v3.4.8 release; its version is the one Upkeep installed.
[apps.intelli-shell]
name = "Intelli Shell"
kind = "archive"
repo = "lasantosr/intelli-shell"
asset = '^intelli-shell-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^intelli-shell-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/intelli-shell"
bins = ["intelli-shell"]
probe = false
