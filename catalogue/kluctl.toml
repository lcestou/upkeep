# Drafted from kluctl/kluctl's v2.28.2 release; its version is the one Upkeep installed.
[apps.kluctl]
name = "kluctl"
kind = "archive"
repo = "kluctl/kluctl"
asset = '^kluctl_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kluctl_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kluctl"
bins = ["kluctl"]
probe = false
