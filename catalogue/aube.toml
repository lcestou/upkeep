# Drafted from aubepkg/aube's v2.10.0 release; its version is the one Upkeep installed.
[apps.aube]
name = "aube"
kind = "archive"
repo = "aubepkg/aube"
asset = '^aube-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^aube-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/aube"
folder = "~/.local/share/aube"
bins = ["aube"]
probe = false
