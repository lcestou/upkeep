# Drafted from TwilitRealm/dusklight's v2.0.3 release; its version is the one Upkeep installed.
[apps.dusklight]
name = "Dusklight"
kind = "appimage"
repo = "TwilitRealm/dusklight"
asset = '^Dusklight-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^Dusklight-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/dusklight.AppImage"
probe = false
