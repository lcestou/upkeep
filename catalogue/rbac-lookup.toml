# Drafted from FairwindsOps/rbac-lookup's v0.10.3 release.
[apps.rbac-lookup]
name = "Rbac Lookup"
kind = "archive"
repo = "FairwindsOps/rbac-lookup"
asset = '^rbac-lookup_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^rbac-lookup_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/rbac-lookup"
bins = ["rbac-lookup"]
version_args = ["version"]
