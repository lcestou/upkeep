# Drafted from reproducible-containers/diffoci's v0.1.8 release; its version is the one Upkeep installed.
[apps.diffoci]
name = "diffoci"
kind = "file"
repo = "reproducible-containers/diffoci"
asset = '^diffoci-.*\.linux-amd64$'
asset_aarch64 = '^diffoci-.*\.linux-arm64$'
dest = "~/.local/bin/diffoci"
probe = false
