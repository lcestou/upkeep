# Drafted from aquasecurity/kube-bench's v0.16.0 release; its version is the one Upkeep installed.
[apps.kube-bench]
name = "Kube Bench"
kind = "archive"
repo = "aquasecurity/kube-bench"
asset = '^kube-bench_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kube-bench_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kube-bench"
folder = "~/.local/share/kube-bench"
bins = ["kube-bench"]
probe = false
