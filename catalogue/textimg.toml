# Drafted from jiro4989/textimg's v3.2.4 release; its version is the one Upkeep installed.
[apps.textimg]
name = "textimg"
kind = "archive"
repo = "jiro4989/textimg"
asset = '^textimg-linux-amd64\.tar\.gz$'
asset_aarch64 = '^textimg-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/textimg"
bins = ["textimg"]
probe = false
