# Drafted from tailwindlabs/tailwindcss's v4.3.5 release; its version is the one Upkeep installed.
[apps.tailwindcss]
name = "tailwindcss"
kind = "file"
repo = "tailwindlabs/tailwindcss"
asset = '^tailwindcss-linux-x64$'
asset_aarch64 = '^tailwindcss-linux-arm64$'
dest = "~/.local/bin/tailwindcss"
probe = false
