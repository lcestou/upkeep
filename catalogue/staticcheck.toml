# Drafted from dominikh/go-tools's 2026.2.2 release.
[apps.staticcheck]
name = "Go Tools"
kind = "archive"
repo = "dominikh/go-tools"
asset = '^staticcheck_linux_amd64\.tar\.gz$'
asset_aarch64 = '^staticcheck_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/staticcheck"
bins = ["staticcheck/staticcheck"]
