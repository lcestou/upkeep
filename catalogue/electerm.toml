# The version is read from the AppImage's own .desktop file (X-AppImage-Version): an Electron app opens its window when asked for --version.
# The regexes skip the -legacy twins built for old systems.
[apps.electerm]
name = "electerm"
kind = "appimage"
repo = "electerm/electerm"
asset = '^electerm-[0-9.]+-linux-x86_64\.AppImage$'
asset_aarch64 = '^electerm-[0-9.]+-linux-arm64\.AppImage$'
dest = "~/.local/bin/electerm.AppImage"
meta_path = "electerm.desktop"
process = "electerm"
relaunch = true
