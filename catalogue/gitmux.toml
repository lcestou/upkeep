# Drafted from arl/gitmux's v0.11.5 release; its version is the one Upkeep installed.
[apps.gitmux]
name = "gitmux"
kind = "archive"
repo = "arl/gitmux"
asset = '^gitmux_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^gitmux_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gitmux"
bins = ["gitmux"]
probe = false
