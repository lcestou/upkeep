# Drafted from mattn/algia's v0.0.138 release.
[apps.algia]
name = "algia"
kind = "archive"
repo = "mattn/algia"
asset = '^algia_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^algia_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/algia"
folder = "~/.local/share/algia"
bins = ["algia"]
version_args = ["version"]
