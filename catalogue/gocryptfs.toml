# Drafted from rfjakob/gocryptfs's v2.7.0 release; its version is the one Upkeep installed.
[apps.gocryptfs]
name = "gocryptfs"
kind = "archive"
repo = "rfjakob/gocryptfs"
asset = '^gocryptfs_.*_linux-static_amd64\.tar\.gz$'
asset_aarch64 = '^gocryptfs_.*_linux-static_arm64\.tar\.gz$'
dest = "~/.local/bin/gocryptfs"
bins = ["gocryptfs", "gocryptfs-xray"]
probe = false
