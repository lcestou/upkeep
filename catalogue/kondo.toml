# Drafted from tbillington/kondo's v0.9 release; its version is the one Upkeep installed.
[apps.kondo]
name = "kondo"
kind = "archive"
repo = "tbillington/kondo"
asset = '^kondo-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^kondo-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/kondo"
bins = ["kondo"]
probe = false
