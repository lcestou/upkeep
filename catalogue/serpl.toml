# Drafted from yassinebridi/serpl's 0.3.11 release; its version is the one Upkeep installed.
[apps.serpl]
name = "serpl"
kind = "archive"
repo = "yassinebridi/serpl"
asset = '^serpl-.*-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^serpl-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/serpl"
bins = ["serpl"]
probe = false
