# Drafted from dhth/bmm's v0.3.1 release; its version is the one Upkeep installed.
[apps.bmm]
name = "bmm"
kind = "archive"
repo = "dhth/bmm"
asset = '^bmm-x86_64-unknown-linux-gnu\.tar\.xz$'
asset_aarch64 = '^bmm-aarch64-unknown-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/bmm"
bins = ["bmm-x86_64-unknown-linux-gnu/bmm"]
probe = false
