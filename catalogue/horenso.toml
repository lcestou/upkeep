# Drafted from Songmu/horenso's v0.11.0 release; its version is the one Upkeep installed.
[apps.horenso]
name = "horenso"
kind = "archive"
repo = "Songmu/horenso"
asset = '^horenso_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^horenso_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/horenso"
folder = "~/.local/share/horenso"
bins = ["horenso"]
probe = false
