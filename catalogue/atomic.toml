# Drafted from atomicdotdev/atomic's v0.22.1 release; its version is the one Upkeep installed.
[apps.atomic]
name = "atomic"
kind = "archive"
repo = "atomicdotdev/atomic"
asset = '^atomic-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^atomic-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/atomic"
folder = "~/.local/share/atomic"
bins = ["atomic"]
probe = false
