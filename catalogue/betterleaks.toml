# Drafted from betterleaks/betterleaks's v1.10.1 release; its version is the one Upkeep installed.
[apps.betterleaks]
name = "betterleaks"
kind = "archive"
repo = "betterleaks/betterleaks"
asset = '^betterleaks_.*_linux_x64\.tar\.gz$'
asset_aarch64 = '^betterleaks_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/betterleaks"
bins = ["betterleaks"]
probe = false
