# Drafted from prefix-dev/pixi's v0.84.2 release; its version is the one Upkeep installed.
[apps.pixi]
name = "pixi"
kind = "archive"
repo = "prefix-dev/pixi"
asset = '^pixi-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^pixi-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/pixi"
bins = ["pixi"]
probe = false
