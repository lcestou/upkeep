# Drafted from vercel-labs/agent-desktop's v1.3.1 release.
[apps.agent-desktop]
name = "Agent Desktop"
kind = "archive"
repo = "vercel-labs/agent-desktop"
asset = '^agent-desktop-v[0-9][0-9A-Za-z.]*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^agent-desktop-v[0-9][0-9A-Za-z.]*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/agent-desktop"
bins = ["agent-desktop", "agent-desktop-linux-clipboard-owner"]
