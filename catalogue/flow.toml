# Drafted from neurocyte/flow's v0.7.2 release; its version is the one Upkeep installed.
[apps.flow]
name = "flow"
kind = "archive"
repo = "neurocyte/flow"
asset = '^flow-.*-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^flow-.*-linux-aarch64\.tar\.gz$'
dest = "~/.local/bin/flow"
bins = ["flow"]
probe = false
