# Drafted from github/copilot-cli's v1.0.112 release; its version is the one Upkeep installed.
[apps.copilot]
name = "Copilot Cli"
kind = "archive"
repo = "github/copilot-cli"
asset = '^copilot-linuxmusl-x64\.tar\.gz$'
asset_aarch64 = '^copilot-linuxmusl-arm64\.tar\.gz$'
dest = "~/.local/bin/copilot"
bins = ["copilot"]
probe = false
