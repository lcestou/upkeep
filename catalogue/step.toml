# Drafted from smallstep/cli's v0.31.0 release; its version is the one Upkeep installed.
[apps.step]
name = "smallstep"
kind = "archive"
repo = "smallstep/cli"
asset = '^step_linux_amd64\.tar\.gz$'
asset_aarch64 = '^step_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/step"
bins = ["step_linux_amd64/bin/step"]
probe = false
