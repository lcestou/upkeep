# Drafted from ikawaha/kagome's v2.11.1 release; its version is the one Upkeep installed.
[apps.kagome]
name = "kagome"
kind = "archive"
repo = "ikawaha/kagome"
asset = '^kagome_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kagome_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kagome"
bins = ["kagome"]
probe = false
