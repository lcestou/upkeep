# Drafted from mattn/goreman's v0.3.19 release.
[apps.goreman]
name = "goreman"
kind = "archive"
repo = "mattn/goreman"
asset = '^goreman_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^goreman_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/goreman"
folder = "~/.local/share/goreman"
bins = ["goreman"]
version_args = ["version"]
