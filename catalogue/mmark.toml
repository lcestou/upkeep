# Drafted from mmarkdown/mmark's v2.2.48 release; its version is the one Upkeep installed.
[apps.mmark]
name = "mmark"
kind = "archive"
repo = "mmarkdown/mmark"
asset = '^mmark_.*_linux_amd64\.tgz$'
asset_aarch64 = '^mmark_.*_linux_arm64\.tgz$'
dest = "~/.local/bin/mmark"
bins = ["mmark"]
probe = false
