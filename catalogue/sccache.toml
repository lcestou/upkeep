# Drafted from mozilla/sccache's v0.19.0 release; its version is the one Upkeep installed.
[apps.sccache]
name = "sccache"
kind = "archive"
repo = "mozilla/sccache"
asset = '^sccache-v[0-9][0-9A-Za-z.]*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^sccache-v[0-9][0-9A-Za-z.]*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/sccache"
bins = ["sccache-v0.19.0-x86_64-unknown-linux-musl/sccache"]
probe = false
