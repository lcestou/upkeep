# Drafted from cocogitto/cocogitto's 7.0.0 release; its version is the one Upkeep installed.
[apps.cog]
name = "cocogitto"
kind = "archive"
repo = "cocogitto/cocogitto"
asset = '^cocogitto-.*-x86_64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/cog"
bins = ["x86_64-unknown-linux-musl/cog"]
probe = false
