# Drafted from k1LoW/ndiag's v0.15.5 release; its version is the one Upkeep installed.
[apps.ndiag]
name = "ndiag"
kind = "archive"
repo = "k1LoW/ndiag"
asset = '^ndiag_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ndiag_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ndiag"
bins = ["ndiag"]
probe = false
