# Drafted from kastenhq/kubestr's v0.4.49 release; its version is the one Upkeep installed.
[apps.kubestr]
name = "kubestr"
kind = "archive"
repo = "kastenhq/kubestr"
asset = '^kubestr_.*_Linux_amd64\.tar\.gz$'
asset_aarch64 = '^kubestr_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubestr"
bins = ["kubestr"]
probe = false
