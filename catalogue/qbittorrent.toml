# Drafted from qbittorrent/qBittorrent's release-5.3.0 release; its version is the one Upkeep installed.
[apps.qbittorrent]
name = "QBittorrent"
kind = "appimage"
repo = "qbittorrent/qBittorrent"
asset = '^qbittorrent-[0-9][0-9A-Za-z.]*_x86_64\.AppImage$'
dest = "~/.local/bin/qbittorrent.AppImage"
probe = false
