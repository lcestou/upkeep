# Drafted from vectordotdev/vector's v0.61.0 release; its version is the one Upkeep installed.
[apps.vector]
name = "vector"
kind = "archive"
repo = "vectordotdev/vector"
asset = '^vector-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^vector-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/vector"
folder = "~/.local/share/vector"
bins = ["bin/vector"]
probe = false
