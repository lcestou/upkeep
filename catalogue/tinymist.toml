# Drafted from Myriad-Dreamin/tinymist's v0.15.12 release; its version is the one Upkeep installed.
[apps.tinymist]
name = "tinymist"
kind = "archive"
repo = "Myriad-Dreamin/tinymist"
asset = '^tinymist-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^tinymist-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/tinymist"
bins = ["tinymist-x86_64-unknown-linux-gnu/tinymist"]
probe = false
