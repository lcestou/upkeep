# The version is read from the AppImage's own .desktop file (X-AppImage-Version): an Electron app opens its window when asked for --version.
[apps.escrcpy]
name = "Escrcpy"
kind = "appimage"
repo = "viarotel-org/escrcpy"
asset = '^Escrcpy-[0-9.]+-linux-x86_64\.AppImage$'
asset_aarch64 = '^Escrcpy-[0-9.]+-linux-arm64\.AppImage$'
dest = "~/.local/bin/escrcpy.AppImage"
meta_path = "escrcpy.desktop"
process = "escrcpy"
relaunch = true
