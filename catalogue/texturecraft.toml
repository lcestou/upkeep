# Drafted from storytold/texturecraft's v0.6.1 release; its version is the one Upkeep installed.
[apps.texturecraft]
name = "texturecraft"
kind = "appimage"
repo = "storytold/texturecraft"
asset = '^texturecraft-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^texturecraft-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/texturecraft.AppImage"
probe = false
