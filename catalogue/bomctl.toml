# Drafted from bomctl/bomctl's v0.4.3 release; its version is the one Upkeep installed.
[apps.bomctl]
name = "bomctl"
kind = "archive"
repo = "bomctl/bomctl"
asset = '^bomctl_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^bomctl_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/bomctl"
bins = ["bomctl"]
probe = false
