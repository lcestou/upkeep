# Drafted from LinwoodDev/Butterfly's v2.6.2 release; its version is the one Upkeep installed.
[apps.linwood-butterfly]
name = "Butterfly"
kind = "appimage"
repo = "LinwoodDev/Butterfly"
asset = '^linwood-butterfly-linux-x86_64\.AppImage$'
asset_aarch64 = '^linwood-butterfly-linux-arm64\.AppImage$'
dest = "~/.local/bin/linwood-butterfly.AppImage"
probe = false
