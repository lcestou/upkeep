# Drafted from maplibre/martin's martin-v1.16.1 release; its version is the one Upkeep installed.
[apps.martin]
name = "martin"
kind = "archive"
repo = "maplibre/martin"
asset = '^martin-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^martin-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/martin"
bins = ["martin", "martin-cp"]
probe = false
