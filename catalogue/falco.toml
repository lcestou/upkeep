# Drafted from ysugimoto/falco's v2.3.0 release; its version is the one Upkeep installed.
[apps.falco]
name = "falco"
kind = "archive"
repo = "ysugimoto/falco"
asset = '^falco-linux-amd64\.tar\.gz$'
asset_aarch64 = '^falco-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/falco"
bins = ["falco"]
probe = false
