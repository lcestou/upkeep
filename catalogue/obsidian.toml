# The version is read from the AppImage's own .desktop file (X-AppImage-Version): an Electron or Flutter app opens its window when asked for --version.
[apps.obsidian]
name = "Obsidian"
kind = "appimage"
repo = "obsidianmd/obsidian-releases"
asset = '^Obsidian-[0-9.]+\.AppImage$'
asset_aarch64 = '^Obsidian-[0-9.]+-arm64\.AppImage$'
dest = "~/.local/bin/obsidian.AppImage"
meta_path = "md.obsidian.Obsidian.desktop"
process = "obsidian"
relaunch = true
