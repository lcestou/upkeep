# Drafted from jj-vcs/jj's v0.47.1 release; its version is the one Upkeep installed.
[apps.jj]
name = "jj"
kind = "archive"
repo = "jj-vcs/jj"
asset = '^jj-.*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^jj-.*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/jj"
bins = ["jj"]
probe = false
