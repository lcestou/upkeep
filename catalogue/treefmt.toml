# Drafted from numtide/treefmt's v2.6.0 release; its version is the one Upkeep installed.
[apps.treefmt]
name = "treefmt"
kind = "archive"
repo = "numtide/treefmt"
asset = '^treefmt_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^treefmt_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/treefmt"
bins = ["treefmt"]
probe = false
