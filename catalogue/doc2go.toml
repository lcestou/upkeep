# Drafted from abhinav/doc2go's v0.12.2 release; its version is the one Upkeep installed.
[apps.doc2go]
name = "doc2go"
kind = "archive"
repo = "abhinav/doc2go"
asset = '^doc2go-linux-amd64\.tar\.gz$'
asset_aarch64 = '^doc2go-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/doc2go"
bins = ["doc2go"]
probe = false
