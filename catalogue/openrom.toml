# Drafted from M5Devs/OpenROM's v4.1.0 release; its version is the one Upkeep installed.
[apps.openrom]
name = "OpenROM"
kind = "appimage"
repo = "M5Devs/OpenROM"
asset = '^OpenROM-.*_Linux_x86_64\.AppImage$'
asset_aarch64 = '^OpenROM-.*_Linux_arm64\.AppImage$'
dest = "~/.local/bin/openrom.AppImage"
probe = false
