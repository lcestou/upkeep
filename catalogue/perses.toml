# Drafted from perses/perses's v0.55.1 release; its version is the one Upkeep installed.
[apps.perses]
name = "perses"
kind = "archive"
repo = "perses/perses"
asset = '^perses_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^perses_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/perses"
folder = "~/.local/share/perses"
bins = ["perses"]
probe = false
