# Drafted from gittower/git-flow-next's v2.1.0 release.
[apps.git-flow]
name = "Git Flow Next"
kind = "archive"
repo = "gittower/git-flow-next"
asset = '^git-flow-next-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^git-flow-next-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/git-flow"
bins = ["git-flow"]
version_args = ["version"]
