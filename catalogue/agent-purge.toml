# Drafted from ZiChuanLan/agent-purge's v0.2.33 release; its version is the one Upkeep installed.
[apps.agent-purge]
name = "Agent Purge"
kind = "appimage"
repo = "ZiChuanLan/agent-purge"
asset = '^agent-purge-.*-linux-x64\.AppImage$'
