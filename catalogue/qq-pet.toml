# Drafted from xuemian168/qqpet_automation's v1.6.1 release; its version is the one Upkeep installed.
[apps.qq-pet]
name = "Qqpet Automation"
kind = "appimage"
repo = "xuemian168/qqpet_automation"
asset = '^qq-pet-.*-x86_64\.AppImage$'
asset_aarch64 = '^qq-pet-.*-arm64\.AppImage$'
dest = "~/.local/bin/qq-pet.AppImage"
probe = false
