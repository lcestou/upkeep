# Drafted from blinkdisk/blinkdisk's v1.11.0 release; its version is the one Upkeep installed.
[apps.blinkdisk]
name = "BlinkDisk"
kind = "appimage"
repo = "blinkdisk/blinkdisk"
asset = '^BlinkDisk-Linux-x86_64\.AppImage$'
asset_aarch64 = '^BlinkDisk-Linux-arm64\.AppImage$'
dest = "~/.local/bin/blinkdisk.AppImage"
probe = false
