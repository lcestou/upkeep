# Drafted from denizgursoy/gotouch's v1.17.0 release; its version is the one Upkeep installed.
[apps.gotouch]
name = "gotouch"
kind = "archive"
repo = "denizgursoy/gotouch"
asset = '^gotouch_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^gotouch_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gotouch"
bins = ["gotouch"]
probe = false
