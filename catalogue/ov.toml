# Drafted from noborus/ov's v0.55.0 release; its version is the one Upkeep installed.
[apps.ov]
name = "ov"
kind = "archive"
repo = "noborus/ov"
asset = '^ov_.*_linux_amd64\.zip$'
asset_aarch64 = '^ov_.*_linux_arm64\.zip$'
dest = "~/.local/bin/ov"
folder = "~/.local/share/ov"
bins = ["ov"]
probe = false
