# Drafted from tus/tusd's v2.10.1 release; its version is the one Upkeep installed.
[apps.tusd]
name = "tusd"
kind = "archive"
repo = "tus/tusd"
asset = '^tusd_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tusd_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tusd"
bins = ["tusd_linux_amd64/tusd"]
probe = false
