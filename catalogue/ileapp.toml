# Drafted from abrignoni/iLEAPP's v2026.4.6 release; its version is the one Upkeep installed.
[apps.ileapp]
name = "iLEAPP"
kind = "appimage"
repo = "abrignoni/iLEAPP"
asset = '^iLEAPP-.*-linux-x64\.AppImage$'
asset_aarch64 = '^iLEAPP-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/ileapp.AppImage"
probe = false
