# Drafted from omrikiei/ktunnel's v2.5.0 release; its version is the one Upkeep installed.
[apps.ktunnel]
name = "ktunnel"
kind = "archive"
repo = "omrikiei/ktunnel"
asset = '^ktunnel_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^ktunnel_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ktunnel"
bins = ["ktunnel"]
probe = false
