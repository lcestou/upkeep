# Drafted from QuentiumYT/Stacer's v1.8.0 release; its version is the one Upkeep installed.
[apps.stacer]
name = "Stacer"
kind = "appimage"
repo = "QuentiumYT/Stacer"
asset = '^Stacer-.*-x86_64\.AppImage$'
asset_aarch64 = '^Stacer-.*-aarch64\.AppImage$'
dest = "~/.local/bin/stacer.AppImage"
probe = false
