# Drafted from Songmu/ecschedule's v0.21.1 release.
[apps.ecschedule]
name = "ecschedule"
kind = "archive"
repo = "Songmu/ecschedule"
asset = '^ecschedule_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ecschedule_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ecschedule"
folder = "~/.local/share/ecschedule"
bins = ["ecschedule"]
