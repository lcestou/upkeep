# Drafted from stunnel/static-curl's 8.23.0-1 release; its version is the one Upkeep installed.
[apps.curl]
name = "Static Curl"
kind = "archive"
repo = "stunnel/static-curl"
asset = '^curl-linux-x86_64-musl-.*\.tar\.xz$'
asset_aarch64 = '^curl-linux-aarch64-musl-.*\.tar\.xz$'
dest = "~/.local/bin/curl"
folder = "~/.local/share/curl"
bins = ["curl"]
probe = false
