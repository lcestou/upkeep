# Drafted from generalaction/emdash's v1.2.11 release; its version is the one Upkeep installed.
[apps.emdash]
name = "emdash"
kind = "appimage"
repo = "generalaction/emdash"
asset = '^emdash-x86_64\.AppImage$'
asset_aarch64 = '^emdash-arm64\.AppImage$'
dest = "~/.local/bin/emdash.AppImage"
probe = false
