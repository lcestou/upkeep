# Drafted from fujiwara/awslim's v0.9.0 release; its version is the one Upkeep installed.
[apps.awslim]
name = "awslim"
kind = "archive"
repo = "fujiwara/awslim"
asset = '^awslim_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^awslim_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/awslim"
bins = ["awslim"]
probe = false
