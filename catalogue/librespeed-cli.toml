# Drafted from librespeed/speedtest-cli's v1.0.14 release.
[apps.librespeed-cli]
name = "Speedtest Cli"
kind = "archive"
repo = "librespeed/speedtest-cli"
asset = '^librespeed-cli_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^librespeed-cli_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/librespeed-cli"
bins = ["librespeed-cli"]
