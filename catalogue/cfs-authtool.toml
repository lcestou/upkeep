# Drafted from cubefs/cubefs's v3.6.0 release; its version is the one Upkeep installed.
[apps.cfs-authtool]
name = "cubefs"
kind = "archive"
repo = "cubefs/cubefs"
asset = '^cubefs-.*-linux-amd64\.tar\.gz$'
dest = "~/.local/bin/cfs-authtool"
folder = "~/.local/share/cfs-authtool"
bins = ["build/bin/cfs-authtool"]
probe = false
