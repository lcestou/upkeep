# Drafted from jamaljsr/polar's v4.0.0 release; its version is the one Upkeep installed.
[apps.polar]
name = "polar"
kind = "appimage"
repo = "jamaljsr/polar"
asset = '^polar-linux-x86_64-.*\.AppImage$'
asset_aarch64 = '^polar-linux-arm64-.*\.AppImage$'
dest = "~/.local/bin/polar.AppImage"
probe = false
