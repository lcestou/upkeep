# Drafted from gcla/termshark's v2.4.0 release; its version is the one Upkeep installed.
[apps.termshark]
name = "termshark"
kind = "archive"
repo = "gcla/termshark"
asset = '^termshark_.*_linux_x64\.tar\.gz$'
asset_aarch64 = '^termshark_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/termshark"
bins = ["termshark_2.4.0_linux_x64/termshark"]
probe = false
