# Drafted from LuaLS/lua-language-server's 3.19.2 release; its version is the one Upkeep installed.
[apps.lua-language-server]
name = "Lua Language Server"
kind = "archive"
repo = "LuaLS/lua-language-server"
asset = '^lua-language-server-.*-linux-x64\.tar\.gz$'
asset_aarch64 = '^lua-language-server-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/lua-language-server"
folder = "~/.local/share/lua-language-server"
bins = ["bin/lua-language-server"]
probe = false
