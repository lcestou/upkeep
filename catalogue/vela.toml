# Drafted from kubevela/kubevela's v1.11.1 release; its version is the one Upkeep installed.
[apps.vela]
name = "kubevela"
kind = "archive"
repo = "kubevela/kubevela"
asset = '^vela-.*-linux-amd64\.zip$'
asset_aarch64 = '^vela-.*-linux-arm64\.zip$'
dest = "~/.local/bin/vela"
bins = ["linux-amd64/vela"]
probe = false
