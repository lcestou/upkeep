# Drafted from m7medVision/lazycommit's v2.1.0 release; its version is the one Upkeep installed.
[apps.lazycommit]
name = "lazycommit"
kind = "archive"
repo = "m7medVision/lazycommit"
asset = '^lazycommit_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^lazycommit_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/lazycommit"
bins = ["lazycommit"]
probe = false
