# Drafted from apache/maven-mvnd's 1.0.6 release; its version is the one Upkeep installed.
[apps.mvnd]
name = "Maven Mvnd"
kind = "archive"
repo = "apache/maven-mvnd"
asset = '^maven-mvnd-.*-linux-amd64\.zip$'
asset_aarch64 = '^maven-mvnd-.*-linux-aarch64\.zip$'
dest = "~/.local/bin/mvnd"
folder = "~/.local/share/mvnd"
bins = ["bin/mvnd"]
probe = false
