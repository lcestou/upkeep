# Drafted from pragtical/pragtical's v3.15.0 release; its version is the one Upkeep installed.
[apps.pragtical]
name = "Pragtical"
kind = "appimage"
repo = "pragtical/pragtical"
asset = '^Pragtical-.*-x86_64\.AppImage$'
asset_aarch64 = '^Pragtical-.*-aarch64\.AppImage$'
dest = "~/.local/bin/pragtical.AppImage"
probe = false
