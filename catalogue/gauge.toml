# Drafted from getgauge/gauge's v1.6.43 release; its version is the one Upkeep installed.
[apps.gauge]
name = "gauge"
kind = "archive"
repo = "getgauge/gauge"
asset = '^gauge-.*-linux\.x86_64\.zip$'
asset_aarch64 = '^gauge-.*-linux\.arm64\.zip$'
dest = "~/.local/bin/gauge"
bins = ["gauge"]
probe = false
