# Drafted from ekristen/aws-nuke's v3.69.1 release; its version is the one Upkeep installed.
[apps.aws-nuke]
name = "Aws Nuke"
kind = "archive"
repo = "ekristen/aws-nuke"
asset = '^aws-nuke-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^aws-nuke-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/aws-nuke"
bins = ["aws-nuke"]
probe = false
