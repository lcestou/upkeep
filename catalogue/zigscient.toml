# Drafted from llogick/zigscient's 0.17.1 release; its version is the one Upkeep installed.
[apps.zigscient]
name = "zigscient"
kind = "archive"
repo = "llogick/zigscient"
asset = '^zigscient-x86_64-linux\.zip$'
asset_aarch64 = '^zigscient-aarch64-linux\.zip$'
dest = "~/.local/bin/zigscient"
bins = ["zigscient*"]
probe = false
