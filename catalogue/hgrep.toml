# Drafted from rhysd/hgrep's v0.3.9 release.
[apps.hgrep]
name = "hgrep"
kind = "archive"
repo = "rhysd/hgrep"
asset = '^hgrep-.*-x86_64-unknown-linux-gnu\.zip$'
asset_aarch64 = '^hgrep-.*-aarch64-unknown-linux-gnu\.zip$'
dest = "~/.local/bin/hgrep"
bins = ["hgrep-v0.3.9-x86_64-unknown-linux-gnu/hgrep"]
