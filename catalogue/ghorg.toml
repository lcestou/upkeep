# Drafted from gabrie30/ghorg's v1.11.17 release; its version is the one Upkeep installed.
[apps.ghorg]
name = "ghorg"
kind = "archive"
repo = "gabrie30/ghorg"
asset = '^ghorg_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^ghorg_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ghorg"
bins = ["ghorg"]
probe = false
