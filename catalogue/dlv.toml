# Drafted from go-delve/delve's v1.27.2 release; its version is the one Upkeep installed.
[apps.dlv]
name = "delve"
kind = "archive"
repo = "go-delve/delve"
asset = '^dlv_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^dlv_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/dlv"
bins = ["dlv"]
probe = false
