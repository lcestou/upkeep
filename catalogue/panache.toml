# Drafted from jolars/panache's v3.18.0 release; its version is the one Upkeep installed.
[apps.panache]
name = "panache"
kind = "archive"
repo = "jolars/panache"
asset = '^panache-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^panache-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/panache"
bins = ["panache"]
probe = false
