# Drafted from Dotneteer/kliveide's v0.67.0 release; its version is the one Upkeep installed.
[apps.kliveide]
name = "KliveIdeSetup"
kind = "appimage"
repo = "Dotneteer/kliveide"
asset = '^KliveIdeSetup-.*-x86_64\.AppImage$'
asset_aarch64 = '^KliveIdeSetup-.*-arm64\.AppImage$'
dest = "~/.local/bin/kliveide.AppImage"
probe = false
