# Drafted from docker/docker-agent's v1.161.0 release; its version is the one Upkeep installed.
[apps.docker-agent]
name = "Docker Agent"
kind = "file"
repo = "docker/docker-agent"
asset = '^docker-agent-linux-amd64$'
asset_aarch64 = '^docker-agent-linux-arm64$'
dest = "~/.local/bin/docker-agent"
probe = false
