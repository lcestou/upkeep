# Drafted from planetscale/cli's v0.352.0 release; its version is the one Upkeep installed.
[apps.pscale]
name = "pscale"
kind = "archive"
repo = "planetscale/cli"
asset = '^pscale_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^pscale_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/pscale"
bins = ["pscale"]
probe = false
