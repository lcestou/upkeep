# Drafted from topgrade-rs/topgrade's v17.16.0 release; its version is the one Upkeep installed.
[apps.topgrade]
name = "topgrade"
kind = "archive"
repo = "topgrade-rs/topgrade"
asset = '^topgrade-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^topgrade-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/topgrade"
bins = ["topgrade"]
probe = false
