# Drafted from jdx/pitchfork's v2.34.0 release; its version is the one Upkeep installed.
[apps.pitchfork]
name = "pitchfork"
kind = "archive"
repo = "jdx/pitchfork"
asset = '^pitchfork-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^pitchfork-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/pitchfork"
bins = ["pitchfork"]
probe = false
