# Drafted from Gentleman-Programming/engram's v3.7.2 release.
[apps.engram]
name = "engram"
kind = "archive"
repo = "Gentleman-Programming/engram"
asset = '^engram_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^engram_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/engram"
folder = "~/.local/share/engram"
bins = ["engram"]
