# Drafted from xemu-project/xemu's v0.8.139 release; its version is the one Upkeep installed.
[apps.xemu]
name = "xemu"
kind = "appimage"
repo = "xemu-project/xemu"
asset = '^xemu-[0-9][0-9A-Za-z.]*-x86_64\.AppImage$'
asset_aarch64 = '^xemu-[0-9][0-9A-Za-z.]*-aarch64\.AppImage$'
dest = "~/.local/bin/xemu.AppImage"
probe = false
