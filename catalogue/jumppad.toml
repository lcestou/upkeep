# Drafted from jumppad-labs/jumppad's 0.29.0 release; its version is the one Upkeep installed.
[apps.jumppad]
name = "jumppad"
kind = "archive"
repo = "jumppad-labs/jumppad"
asset = '^jumppad_.*_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^jumppad_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/jumppad"
bins = ["jumppad"]
probe = false
