# Drafted from c-bata/kube-prompt's v1.0.11 release; its version is the one Upkeep installed.
[apps.kube-prompt]
name = "Kube Prompt"
kind = "archive"
repo = "c-bata/kube-prompt"
asset = '^kube-prompt_.*_linux_amd64\.zip$'
asset_aarch64 = '^kube-prompt_.*_linux_arm64\.zip$'
dest = "~/.local/bin/kube-prompt"
bins = ["kube-prompt"]
probe = false
