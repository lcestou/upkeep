# Drafted from moby/buildkit's v0.35.0 release.
[apps.buildctl]
name = "buildkit"
kind = "archive"
repo = "moby/buildkit"
asset = '^buildkit-.*\.linux-amd64\.tar\.gz$'
asset_aarch64 = '^buildkit-.*\.linux-arm64\.tar\.gz$'
dest = "~/.local/bin/buildctl"
folder = "~/.local/share/buildctl"
bins = ["buildctl", "buildkit-cni-bridge", "buildkit-cni-firewall", "buildkit-cni-host-local", "buildkit-cni-loopback", "buildkit-qemu-aarch64"]
