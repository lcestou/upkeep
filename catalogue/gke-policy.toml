# Drafted from google/gke-policy-automation's v1.4.8 release.
[apps.gke-policy]
name = "Gke Policy Automation"
kind = "archive"
repo = "google/gke-policy-automation"
asset = '^gke-policy-automation_.*_linux_amd64\.zip$'
asset_aarch64 = '^gke-policy-automation_.*_linux_arm64\.zip$'
dest = "~/.local/bin/gke-policy"
bins = ["gke-policy"]
version_args = ["version"]
