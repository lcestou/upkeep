# Drafted from helm/chart-testing's v3.15.0 release; its version is the one Upkeep installed.
[apps.ct]
name = "Chart Testing"
kind = "archive"
repo = "helm/chart-testing"
asset = '^chart-testing_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^chart-testing_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ct"
folder = "~/.local/share/ct"
bins = ["ct"]
probe = false
