# Drafted from liquidmetal-dev/flintlock's v0.16.0 release; its version is the one Upkeep installed.
[apps.flintlockd]
name = "flintlock"
kind = "file"
repo = "liquidmetal-dev/flintlock"
asset = '^flintlockd_amd64$'
