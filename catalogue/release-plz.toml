# Drafted from release-plz/release-plz's release-plz-v0.4.3 release; its version is the one Upkeep installed.
[apps.release-plz]
name = "Release Plz"
kind = "archive"
repo = "release-plz/release-plz"
asset = '^release-plz-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^release-plz-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/release-plz"
bins = ["release-plz"]
probe = false
