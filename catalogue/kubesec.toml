# Drafted from controlplaneio/kubesec's v2.15.0 release.
[apps.kubesec]
name = "kubesec"
kind = "archive"
repo = "controlplaneio/kubesec"
asset = '^kubesec_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kubesec_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubesec"
bins = ["kubesec"]
version_args = ["version"]
