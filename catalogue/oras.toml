# Drafted from oras-project/oras's v1.3.6 release; its version is the one Upkeep installed.
[apps.oras]
name = "oras"
kind = "archive"
repo = "oras-project/oras"
asset = '^oras_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^oras_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/oras"
bins = ["oras"]
probe = false
