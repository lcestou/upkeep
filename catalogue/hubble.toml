# Drafted from cilium/hubble's v1.20.4 release; its version is the one Upkeep installed.
[apps.hubble]
name = "hubble"
kind = "archive"
repo = "cilium/hubble"
asset = '^hubble-linux-amd64\.tar\.gz$'
asset_aarch64 = '^hubble-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/hubble"
bins = ["hubble"]
probe = false
