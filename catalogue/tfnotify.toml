# Drafted from mercari/tfnotify's v1.1.14 release; its version is the one Upkeep installed.
[apps.tfnotify]
name = "tfnotify"
kind = "archive"
repo = "mercari/tfnotify"
asset = '^tfnotify_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tfnotify_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tfnotify"
bins = ["tfnotify"]
probe = false
