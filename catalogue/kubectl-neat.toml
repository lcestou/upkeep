# Drafted from itaysk/kubectl-neat's v2.0.4 release; its version is the one Upkeep installed.
[apps.kubectl-neat]
name = "Kubectl Neat"
kind = "archive"
repo = "itaysk/kubectl-neat"
asset = '^kubectl-neat_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kubectl-neat_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubectl-neat"
bins = ["kubectl-neat"]
probe = false
