# Drafted from cbroglie/mustache's v1.4.2 release; its version is the one Upkeep installed.
[apps.mustache]
name = "mustache"
kind = "archive"
repo = "cbroglie/mustache"
asset = '^mustache_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^mustache_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/mustache"
bins = ["mustache"]
probe = false
