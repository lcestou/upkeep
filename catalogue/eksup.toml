# Drafted from clowdhaus/eksup's v0.15.1 release; its version is the one Upkeep installed.
[apps.eksup]
name = "eksup"
kind = "archive"
repo = "clowdhaus/eksup"
asset = '^eksup-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^eksup-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/eksup"
bins = ["eksup-v0.15.1-x86_64-unknown-linux-gnu/eksup"]
probe = false
