# Drafted from storytold/vectorcraft's v0.24.1 release; its version is the one Upkeep installed.
[apps.vectorcraft]
name = "vectorcraft"
kind = "appimage"
repo = "storytold/vectorcraft"
asset = '^vectorcraft-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^vectorcraft-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/vectorcraft.AppImage"
probe = false
