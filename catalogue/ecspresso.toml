# Drafted from kayac/ecspresso's v3.0.0 release.
[apps.ecspresso]
name = "ecspresso"
kind = "archive"
repo = "kayac/ecspresso"
asset = '^ecspresso_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ecspresso_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ecspresso"
bins = ["ecspresso"]
version_args = ["version"]
