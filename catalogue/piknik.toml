# Drafted from jedisct1/piknik's 0.10.2 release; its version is the one Upkeep installed.
[apps.piknik]
name = "piknik"
kind = "archive"
repo = "jedisct1/piknik"
asset = '^piknik-linux_x86_64-.*\.tar\.gz$'
dest = "~/.local/bin/piknik"
folder = "~/.local/share/piknik"
bins = ["linux-x86_64/piknik"]
probe = false
