# Drafted from protocolbuffers/protobuf's v36.2 release; its version is the one Upkeep installed.
[apps.protoc]
name = "protobuf"
kind = "archive"
repo = "protocolbuffers/protobuf"
asset = '^protoc-.*-linux-x86_64\.zip$'
dest = "~/.local/bin/protoc"
folder = "~/.local/share/protoc"
bins = ["bin/protoc"]
probe = false
