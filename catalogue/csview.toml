# Drafted from wfxr/csview's v1.3.4 release; its version is the one Upkeep installed.
[apps.csview]
name = "csview"
kind = "archive"
repo = "wfxr/csview"
asset = '^csview-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^csview-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/csview"
bins = ["csview-v1.3.4-x86_64-unknown-linux-gnu/csview"]
probe = false
