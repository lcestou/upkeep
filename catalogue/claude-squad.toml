# Drafted from smtg-ai/claude-squad's v1.0.20 release.
[apps.claude-squad]
name = "Claude Squad"
kind = "archive"
repo = "smtg-ai/claude-squad"
asset = '^claude-squad_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^claude-squad_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/claude-squad"
bins = ["claude-squad"]
version_args = ["version"]
