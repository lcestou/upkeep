# Drafted from shenwei356/rush's v0.11.1 release; its version is the one Upkeep installed.
[apps.rush]
name = "rush"
kind = "archive"
repo = "shenwei356/rush"
asset = '^rush_linux_amd64\.tar\.gz$'
asset_aarch64 = '^rush_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/rush"
bins = ["rush"]
probe = false
