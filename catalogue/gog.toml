# Drafted from openclaw/gogcli's v0.48.0 release; its version is the one Upkeep installed.
[apps.gog]
name = "gogcli"
kind = "archive"
repo = "openclaw/gogcli"
asset = '^gogcli_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^gogcli_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gog"
bins = ["gog"]
probe = false
