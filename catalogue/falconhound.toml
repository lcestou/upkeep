# Drafted from FalconForceTeam/FalconHound's v1.4.2 release.
[apps.falconhound]
name = "FalconHound"
kind = "archive"
repo = "FalconForceTeam/FalconHound"
asset = '^FalconHound_Linux_x86_64\.zip$'
asset_aarch64 = '^FalconHound_Linux_arm64\.zip$'
dest = "~/.local/bin/FalconHound"
folder = "~/.local/share/falconhound"
bins = ["FalconHound"]
version_args = ["version"]
