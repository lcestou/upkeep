# Drafted from pachyderm/pachyderm's v2.12.2 release; its version is the one Upkeep installed.
[apps.pachctl]
name = "pachyderm"
kind = "archive"
repo = "pachyderm/pachyderm"
asset = '^pachctl_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^pachctl_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/pachctl"
bins = ["pachctl_2.12.2_linux_amd64/pachctl"]
probe = false
