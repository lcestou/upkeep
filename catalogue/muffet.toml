# Drafted from raviqqe/muffet's v2.11.8 release; its version is the one Upkeep installed.
[apps.muffet]
name = "muffet"
kind = "archive"
repo = "raviqqe/muffet"
asset = '^muffet_linux_amd64\.tar\.gz$'
asset_aarch64 = '^muffet_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/muffet"
bins = ["muffet"]
probe = false
