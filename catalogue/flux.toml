# Drafted from fluxcd/flux2's v2.10.0 release; its version is the one Upkeep installed.
[apps.flux]
name = "flux2"
kind = "archive"
repo = "fluxcd/flux2"
asset = '^flux_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^flux_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/flux"
bins = ["flux"]
probe = false
