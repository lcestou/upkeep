# Drafted from minamijoyo/hcledit's v0.2.19 release; its version is the one Upkeep installed.
[apps.hcledit]
name = "hcledit"
kind = "archive"
repo = "minamijoyo/hcledit"
asset = '^hcledit_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^hcledit_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/hcledit"
bins = ["hcledit"]
probe = false
