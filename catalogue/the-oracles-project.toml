# Drafted from thibautbus/top's v1.4.0 release; its version is the one Upkeep installed.
[apps.the-oracles-project]
name = "top"
kind = "appimage"
repo = "thibautbus/top"
asset = '^the-oracles-project-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^the-oracles-project-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/the-oracles-project.AppImage"
probe = false
