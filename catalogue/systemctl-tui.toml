# Drafted from rgwood/systemctl-tui's v0.8.0 release; its version is the one Upkeep installed.
[apps.systemctl-tui]
name = "Systemctl Tui"
kind = "archive"
repo = "rgwood/systemctl-tui"
asset = '^systemctl-tui-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^systemctl-tui-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/systemctl-tui"
bins = ["systemctl-tui"]
probe = false
