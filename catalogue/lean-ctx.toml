# Drafted from yvgude/lean-ctx's v3.12.5 release; its version is the one Upkeep installed.
[apps.lean-ctx]
name = "Lean Ctx"
kind = "archive"
repo = "yvgude/lean-ctx"
asset = '^lean-ctx-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^lean-ctx-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/lean-ctx"
bins = ["lean-ctx"]
probe = false
