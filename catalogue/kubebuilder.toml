# Drafted from kubernetes-sigs/kubebuilder's v4.16.0 release; its version is the one Upkeep installed.
[apps.kubebuilder]
name = "kubebuilder"
kind = "file"
repo = "kubernetes-sigs/kubebuilder"
asset = '^kubebuilder_linux_amd64$'
asset_aarch64 = '^kubebuilder_linux_arm64$'
dest = "~/.local/bin/kubebuilder"
probe = false
