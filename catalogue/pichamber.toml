# Drafted from RyderAsKing/PiChamber's v1.0.7 release; its version is the one Upkeep installed.
[apps.pichamber]
name = "PiChamber"
kind = "appimage"
repo = "RyderAsKing/PiChamber"
asset = '^PiChamber-.*-x86_64\.AppImage$'
asset_aarch64 = '^PiChamber-.*-arm64\.AppImage$'
dest = "~/.local/bin/pichamber.AppImage"
probe = false
