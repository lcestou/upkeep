# Drafted from new-coke/strikers's v2.0.0 release; its version is the one Upkeep installed.
[apps.strikers]
name = "strikers"
kind = "appimage"
repo = "new-coke/strikers"
asset = '^strikers-linux-x86_64\.AppImage$'
asset_aarch64 = '^strikers-linux-arm64\.AppImage$'
dest = "~/.local/bin/strikers.AppImage"
probe = false
