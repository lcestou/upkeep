# Drafted from kirodotdev/KiroCrew's v0.12.2 release; its version is the one Upkeep installed.
[apps.kirocrew]
name = "KiroCrew"
kind = "appimage"
repo = "kirodotdev/KiroCrew"
asset = '^KiroCrew-.*-x86_64\.AppImage$'
asset_aarch64 = '^KiroCrew-.*-arm64\.AppImage$'
dest = "~/.local/bin/kirocrew.AppImage"
probe = false
