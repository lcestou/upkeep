# Drafted from unisonweb/unison's release/1.5.0 release; its version is the one Upkeep installed.
[apps.unison]
name = "unison"
kind = "archive"
repo = "unisonweb/unison"
asset = '^ucm-linux-x64\.tar\.gz$'
asset_aarch64 = '^ucm-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/unison"
folder = "~/.local/share/unison"
bins = ["unison/unison"]
probe = false
