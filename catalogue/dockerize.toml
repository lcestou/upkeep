# Drafted from jwilder/dockerize's v0.16.0 release; its version is the one Upkeep installed.
[apps.dockerize]
name = "dockerize"
kind = "archive"
repo = "jwilder/dockerize"
asset = '^dockerize-linux-amd64-.*\.tar\.gz$'
asset_aarch64 = '^dockerize-linux-arm64-.*\.tar\.gz$'
dest = "~/.local/bin/dockerize"
bins = ["dockerize"]
probe = false
