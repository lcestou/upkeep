# Drafted from crystal-lang/crystal's 1.22.3 release; its version is the one Upkeep installed.
[apps.crystal]
name = "crystal"
kind = "archive"
repo = "crystal-lang/crystal"
asset = '^crystal-.*-1-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^crystal-.*-1-linux-aarch64\.tar\.gz$'
dest = "~/.local/bin/crystal"
folder = "~/.local/share/crystal"
bins = ["bin/crystal"]
probe = false
