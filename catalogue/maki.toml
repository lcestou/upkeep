# Drafted from tontinton/maki's v0.7.2 release; its version is the one Upkeep installed.
[apps.maki]
name = "maki"
kind = "archive"
repo = "tontinton/maki"
asset = '^maki-.*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^maki-.*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/maki"
bins = ["maki"]
probe = false
