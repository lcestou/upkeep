name = "NX-Optimizer"
kind = "appimage"
repo = "MaxLastBreath/nx-optimizer"
asset = '^NX\.Optimizer\.[0-9][0-9A-Za-z.]*\.AppImage$'
dest = "~/.local/bin/nx-optimizer.AppImage"
probe = false
