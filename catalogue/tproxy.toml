# Drafted from kevwan/tproxy's v0.9.2 release; its version is the one Upkeep installed.
[apps.tproxy]
name = "tproxy"
kind = "archive"
repo = "kevwan/tproxy"
asset = '^tproxy-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^tproxy-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/tproxy"
bins = ["tproxy"]
probe = false
