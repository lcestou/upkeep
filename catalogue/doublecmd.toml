# Drafted from doublecmd/doublecmd's v1.2.11 release; its version is the one Upkeep installed.
[apps.doublecmd]
name = "doublecmd"
kind = "archive"
repo = "doublecmd/doublecmd"
asset = '^doublecmd-.*\.qt\.x86_64\.tar\.xz$'
asset_aarch64 = '^doublecmd-.*\.qt\.aarch64\.tar\.xz$'
dest = "~/.local/bin/doublecmd"
folder = "~/.local/share/doublecmd"
bins = ["doublecmd"]
probe = false
