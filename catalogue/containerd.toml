# Drafted from containerd/containerd's v2.4.2 release; its version is the one Upkeep installed.
[apps.containerd]
name = "containerd"
kind = "archive"
repo = "containerd/containerd"
asset = '^containerd-[0-9][0-9A-Za-z.]*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^containerd-[0-9][0-9A-Za-z.]*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/containerd"
bins = ["bin/containerd", "bin/containerd-shim-runc-v2", "bin/containerd-stress"]
probe = false
