# Drafted from HakanSeven12/OpenCADStudio's v2026.45 release; its version is the one Upkeep installed.
[apps.opencadstudio]
name = "OpenCADStudio"
kind = "appimage"
repo = "HakanSeven12/OpenCADStudio"
asset = '^OpenCADStudio-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^OpenCADStudio-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/opencadstudio.AppImage"
probe = false
