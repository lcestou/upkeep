# Drafted from sqldef/sqldef's v3.11.30 release; its version is the one Upkeep installed.
[apps.mssqldef]
name = "sqldef"
kind = "archive"
repo = "sqldef/sqldef"
asset = '^mssqldef_linux_amd64\.tar\.gz$'
asset_aarch64 = '^mssqldef_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/mssqldef"
bins = ["mssqldef"]
probe = false
