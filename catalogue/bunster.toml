# Drafted from yassinebenaid/bunster's v0.14.0 release; its version is the one Upkeep installed.
[apps.bunster]
name = "bunster"
kind = "archive"
repo = "yassinebenaid/bunster"
asset = '^bunster_linux-amd64\.tar\.gz$'
asset_aarch64 = '^bunster_linux-arm64\.tar\.gz$'
dest = "~/.local/bin/bunster"
bins = ["bunster"]
probe = false
