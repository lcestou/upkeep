# Drafted from PolyMC/PolyMC's 8.1 release; its version is the one Upkeep installed.
[apps.polymc]
name = "PolyMC"
kind = "appimage"
repo = "PolyMC/PolyMC"
asset = '^PolyMC-Linux-amd64-.*\.AppImage$'
asset_aarch64 = '^PolyMC-Linux-aarch64-.*\.AppImage$'
dest = "~/.local/bin/polymc.AppImage"
probe = false
