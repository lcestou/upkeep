# Drafted from syncthing/syncthing's v2.1.7 release.
[apps.syncthing]
name = "syncthing"
kind = "archive"
repo = "syncthing/syncthing"
asset = '^syncthing-linux-amd64-.*\.tar\.gz$'
asset_aarch64 = '^syncthing-linux-arm64-.*\.tar\.gz$'
dest = "~/.local/bin/syncthing"
folder = "~/.local/share/syncthing"
bins = ["syncthing"]
