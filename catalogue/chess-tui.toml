# Drafted from thomas-mauran/chess-tui's 2.8.1 release; its version is the one Upkeep installed.
[apps.chess-tui]
name = "Chess Tui"
kind = "archive"
repo = "thomas-mauran/chess-tui"
asset = '^chess-tui-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^chess-tui-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/chess-tui"
bins = ["chess-tui"]
probe = false
