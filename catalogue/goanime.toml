# Drafted from alvarorichard/GoAnime's v2.0.0 release; its version is the one Upkeep installed.
[apps.goanime]
name = "GoAnime"
kind = "archive"
repo = "alvarorichard/GoAnime"
asset = '^goanime-linux-amd64\.tar\.gz$'
asset_aarch64 = '^goanime-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/goanime"
bins = ["goanime*"]
probe = false
