# Drafted from Linus-Mussmaecher/rucola's v0.10.0 release; its version is the one Upkeep installed.
[apps.rucola]
name = "rucola"
kind = "archive"
repo = "Linus-Mussmaecher/rucola"
asset = '^rucola-notes-x86_64-unknown-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/rucola"
bins = ["rucola-notes-x86_64-unknown-linux-gnu/rucola"]
probe = false
