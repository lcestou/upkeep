# Drafted from kubernetes-sigs/krew's v0.5.0 release; its version is the one Upkeep installed.
[apps.krew]
name = "krew"
kind = "archive"
repo = "kubernetes-sigs/krew"
asset = '^krew-linux_amd64\.tar\.gz$'
asset_aarch64 = '^krew-linux_arm64\.tar\.gz$'
dest = "~/.local/bin/krew"
bins = ["krew*"]
probe = false
