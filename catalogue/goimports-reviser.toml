# Drafted from incu6us/goimports-reviser's v3.13.2 release; its version is the one Upkeep installed.
[apps.goimports-reviser]
name = "Goimports Reviser"
kind = "archive"
repo = "incu6us/goimports-reviser"
asset = '^goimports-reviser_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^goimports-reviser_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/goimports-reviser"
bins = ["goimports-reviser"]
probe = false
