# Drafted from namespacelabs/foundation's v0.0.597 release; its version is the one Upkeep installed.
[apps.bazel-credential-nsc]
name = "foundation"
kind = "archive"
repo = "namespacelabs/foundation"
asset = '^nsc_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^nsc_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/bazel-credential-nsc"
bins = ["bazel-credential-nsc"]
probe = false
