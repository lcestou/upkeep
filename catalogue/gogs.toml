# Drafted from gogs/gogs's v0.14.4 release; its version is the one Upkeep installed.
[apps.gogs]
name = "gogs"
kind = "archive"
repo = "gogs/gogs"
asset = '^gogs_.*_linux_amd64\.zip$'
asset_aarch64 = '^gogs_.*_linux_arm64\.zip$'
dest = "~/.local/bin/gogs"
folder = "~/.local/share/gogs"
bins = ["gogs"]
probe = false
