# Drafted from temporalio/temporal's v1.32.2 release.
[apps.tdbg]
name = "temporal"
kind = "archive"
repo = "temporalio/temporal"
asset = '^temporal_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^temporal_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tdbg"
folder = "~/.local/share/tdbg"
bins = ["tdbg", "temporal-cassandra-tool", "temporal-elasticsearch-tool", "temporal-server", "temporal-sql-tool"]
