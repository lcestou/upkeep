# Drafted from cachix/secretspec's v0.21.1 release.
[apps.secretspec]
name = "secretspec"
kind = "archive"
repo = "cachix/secretspec"
asset = '^secretspec-x86_64-unknown-linux-gnu\.tar\.xz$'
asset_aarch64 = '^secretspec-aarch64-unknown-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/secretspec"
bins = ["secretspec-x86_64-unknown-linux-gnu/secretspec"]
