# Drafted from entireio/git-sync's v0.10.0 release; its version is the one Upkeep installed.
[apps.git-sync]
name = "Git Sync"
kind = "archive"
repo = "entireio/git-sync"
asset = '^git-sync_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^git-sync_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/git-sync"
bins = ["git-sync"]
probe = false
