# Drafted from lindell/multi-gitter's v0.64.0 release.
[apps.multi-gitter]
name = "Multi Gitter"
kind = "archive"
repo = "lindell/multi-gitter"
asset = '^multi-gitter_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^multi-gitter_.*_Linux_ARM64\.tar\.gz$'
dest = "~/.local/bin/multi-gitter"
bins = ["multi-gitter"]
version_args = ["version"]
