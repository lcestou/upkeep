# Drafted from yamafaktory/jql's jql-v9.0.4 release; its version is the one Upkeep installed.
[apps.jql]
name = "jql"
kind = "archive"
repo = "yamafaktory/jql"
asset = '^.*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^.*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/jql"
bins = ["jql"]
probe = false
