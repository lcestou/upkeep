# Drafted from x-motemen/gobump's v0.3.0 release; its version is the one Upkeep installed.
[apps.gobump]
name = "gobump"
kind = "archive"
repo = "x-motemen/gobump"
asset = '^gobump_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^gobump_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gobump"
bins = ["gobump_v0.3.0_linux_amd64/gobump"]
probe = false
