# Drafted from jdx/mise's v2026.11.8 release; its version is the one Upkeep installed.
[apps.mise]
name = "mise"
kind = "archive"
repo = "jdx/mise"
asset = '^mise-.*-linux-x64-musl\.tar\.gz$'
asset_aarch64 = '^mise-.*-linux-arm64-musl\.tar\.gz$'
dest = "~/.local/bin/mise"
folder = "~/.local/share/mise"
bins = ["bin/mise"]
probe = false
