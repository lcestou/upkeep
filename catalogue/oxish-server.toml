# Drafted from djc/oxish's 0.1.0 release; its version is the one Upkeep installed.
[apps.oxish-server]
name = "oxish"
kind = "archive"
repo = "djc/oxish"
asset = '^oxish-x86_64-unknown-linux-gnu\.tar\.xz$'
asset_aarch64 = '^oxish-aarch64-unknown-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/oxish-server"
bins = ["oxish-x86_64-unknown-linux-gnu/oxish-server", "oxish-x86_64-unknown-linux-gnu/oxish-session"]
probe = false
