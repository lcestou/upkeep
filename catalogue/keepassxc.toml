# Drafted from keepassxreboot/keepassxc's 2.8.0 release.
[apps.keepassxc]
name = "KeePassXC"
kind = "appimage"
repo = "keepassxreboot/keepassxc"
asset = '^KeePassXC-[0-9][0-9A-Za-z.]*-x86_64\.AppImage$'
asset_aarch64 = '^KeePassXC-[0-9][0-9A-Za-z.]*-aarch64\.AppImage$'
dest = "~/.local/bin/keepassxc.AppImage"
meta_path = "org.keepassxc.KeePassXC.desktop"
