# Drafted from connectrpc/protoc-gen-connect-openapi's v0.30.0 release.
[apps.protoc-gen-connect-openapi]
name = "Protoc Gen Connect Openapi"
kind = "archive"
repo = "connectrpc/protoc-gen-connect-openapi"
