# Drafted from ilai-deutel/kibi's v0.3.3 release.
[apps.kibi]
name = "kibi"
kind = "archive"
repo = "ilai-deutel/kibi"
asset = '^kibi-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^kibi-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/kibi"
folder = "~/.local/share/kibi"
bins = ["kibi"]
