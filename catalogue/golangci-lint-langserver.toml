# Drafted from nametake/golangci-lint-langserver's v0.0.12 release; its version is the one Upkeep installed.
[apps.golangci-lint-langserver]
name = "Golangci Lint Langserver"
kind = "archive"
repo = "nametake/golangci-lint-langserver"
asset = '^golangci-lint-langserver_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^golangci-lint-langserver_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/golangci-lint-langserver"
bins = ["golangci-lint-langserver"]
probe = false
