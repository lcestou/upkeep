# Drafted from markqvist/Sideband's 2.3.0 release; its version is the one Upkeep installed.
[apps.sideband]
name = "Sideband"
kind = "appimage"
repo = "markqvist/Sideband"
asset = '^Sideband_.*_x86_64\.appimage$'
asset_aarch64 = '^Sideband_.*_aarch64\.appimage$'
dest = "~/.local/bin/sideband.AppImage"
probe = false
