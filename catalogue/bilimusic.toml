# Drafted from HanversionOvO/BiliMusic's v1.0.2 release; its version is the one Upkeep installed.
[apps.bilimusic]
name = "BiliMusic"
kind = "appimage"
repo = "HanversionOvO/BiliMusic"
asset = '^BiliMusic-.*-x86_64\.AppImage$'
asset_aarch64 = '^BiliMusic-.*-arm64\.AppImage$'
dest = "~/.local/bin/bilimusic.AppImage"
probe = false
