name = "CrabPort"
kind = "appimage"
repo = "chi11321/CrabPort"
asset = '^CrabPort-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^CrabPort-.*-linux-aarch64\.AppImage$'
