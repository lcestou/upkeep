# Drafted from mergestat/mergestat-lite's v0.6.2 release; its version is the one Upkeep installed.
[apps.mergestat]
name = "Mergestat Lite"
kind = "archive"
repo = "mergestat/mergestat-lite"
asset = '^mergestat-linux-amd64\.tar\.gz$'
dest = "~/.local/bin/mergestat"
folder = "~/.local/share/mergestat"
bins = ["mergestat"]
probe = false
