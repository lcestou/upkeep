# Drafted from sammy-ette/Hilbish's v2.3.4 release.
[apps.hilbish]
name = "Hilbish"
kind = "archive"
repo = "sammy-ette/Hilbish"
asset = '^hilbish-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^hilbish-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/hilbish"
folder = "~/.local/share/hilbish"
bins = ["hilbish"]
