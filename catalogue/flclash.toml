# Drafted from chen08209/FlClash's v0.9.3 release; its version is the one Upkeep installed.
[apps.flclash]
name = "FlClash"
kind = "appimage"
repo = "chen08209/FlClash"
asset = '^FlClash-.*-linux-amd64\.AppImage$'
asset_aarch64 = '^FlClash-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/flclash.AppImage"
probe = false
