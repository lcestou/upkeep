# Drafted from awslabs/soci-snapshotter's v0.16.1 release; its version is the one Upkeep installed.
[apps.soci]
name = "Soci Snapshotter"
kind = "archive"
repo = "awslabs/soci-snapshotter"
asset = '^soci-snapshotter-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^soci-snapshotter-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/soci"
bins = ["soci", "soci-snapshotter-grpc"]
probe = false
