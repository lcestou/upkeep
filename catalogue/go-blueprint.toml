# Drafted from Melkeydev/go-blueprint's v0.10.11 release; its version is the one Upkeep installed.
[apps.go-blueprint]
name = "Go Blueprint"
kind = "archive"
repo = "Melkeydev/go-blueprint"
asset = '^go-blueprint_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^go-blueprint_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/go-blueprint"
bins = ["go-blueprint"]
probe = false
