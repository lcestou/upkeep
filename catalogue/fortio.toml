# Drafted from fortio/fortio's v1.76.0 release; its version is the one Upkeep installed.
[apps.fortio]
name = "fortio"
kind = "archive"
repo = "fortio/fortio"
asset = '^fortio-linux_amd64-.*\.tgz$'
asset_aarch64 = '^fortio-linux_arm64-.*\.tgz$'
dest = "~/.local/bin/fortio"
bins = ["usr/bin/fortio"]
probe = false
