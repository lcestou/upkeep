# Drafted from hickford/git-credential-oauth's v0.18.0 release.
[apps.git-credential-oauth]
name = "Git Credential Oauth"
kind = "archive"
repo = "hickford/git-credential-oauth"
asset = '^git-credential-oauth_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^git-credential-oauth_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/git-credential-oauth"
bins = ["git-credential-oauth"]
version_args = ["version"]
