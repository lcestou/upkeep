# Drafted from thanos-io/thanos's v0.42.5 release; its version is the one Upkeep installed.
[apps.thanos]
name = "thanos"
kind = "archive"
repo = "thanos-io/thanos"
asset = '^thanos-.*\.linux-amd64\.tar\.gz$'
asset_aarch64 = '^thanos-.*\.linux-arm64\.tar\.gz$'
dest = "~/.local/bin/thanos"
bins = ["thanos-0.42.5.linux-amd64/thanos"]
probe = false
