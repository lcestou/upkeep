# Drafted from hay-kot/scaffold's v0.13.1 release; its version is the one Upkeep installed.
[apps.scaffold]
name = "scaffold"
kind = "archive"
repo = "hay-kot/scaffold"
asset = '^scaffold_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^scaffold_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/scaffold"
bins = ["scaffold"]
probe = false
