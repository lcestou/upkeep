# Drafted from msoap/shell2http's v1.18.0 release; its version is the one Upkeep installed.
[apps.shell2http]
name = "shell2http"
kind = "archive"
repo = "msoap/shell2http"
asset = '^shell2http_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^shell2http_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/shell2http"
bins = ["shell2http"]
probe = false
