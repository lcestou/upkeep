# Drafted from thomasschafer/scooter's v0.10.0 release; its version is the one Upkeep installed.
[apps.scooter]
name = "scooter"
kind = "archive"
repo = "thomasschafer/scooter"
asset = '^scooter-.*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^scooter-.*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/scooter"
bins = ["scooter"]
probe = false
