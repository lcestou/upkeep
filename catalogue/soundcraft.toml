# Drafted from storytold/soundcraft's v0.20.1 release; its version is the one Upkeep installed.
[apps.soundcraft]
name = "soundcraft"
kind = "appimage"
repo = "storytold/soundcraft"
asset = '^soundcraft-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^soundcraft-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/soundcraft.AppImage"
probe = false
