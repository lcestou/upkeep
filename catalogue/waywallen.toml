# Drafted from waywallen/waywallen's v0.6.0 release; its version is the one Upkeep installed.
[apps.waywallen]
name = "waywallen"
kind = "appimage"
repo = "waywallen/waywallen"
asset = '^waywallen-.*-x86_64\.AppImage$'
asset_aarch64 = '^waywallen-.*-aarch64\.AppImage$'
dest = "~/.local/bin/waywallen.AppImage"
probe = false
