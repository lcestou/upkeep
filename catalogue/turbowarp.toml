# Drafted from TurboWarp/desktop's v1.17.1 release.
[apps.turbowarp]
name = "TurboWarp"
kind = "appimage"
repo = "TurboWarp/desktop"
asset = '^TurboWarp-linux-x86_64-.*\.AppImage$'
asset_aarch64 = '^TurboWarp-linux-arm64-.*\.AppImage$'
dest = "~/.local/bin/turbowarp.AppImage"
meta_path = "turbowarp-desktop.desktop"
