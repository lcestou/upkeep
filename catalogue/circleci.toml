# Drafted from CircleCI-Public/circleci-cli's v1.15.0 release.
[apps.circleci]
name = "Circleci Cli"
kind = "archive"
repo = "CircleCI-Public/circleci-cli"
asset = '^circleci-cli_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^circleci-cli_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/circleci"
bins = ["circleci"]
