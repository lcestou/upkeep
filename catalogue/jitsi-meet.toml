# Drafted from jitsi/jitsi-meet-electron's v2026.10.0 release; its version is the one Upkeep installed.
[apps.jitsi-meet]
name = "Jitsi Meet Electron"
kind = "appimage"
repo = "jitsi/jitsi-meet-electron"
asset = '^jitsi-meet-x86_64\.AppImage$'
asset_aarch64 = '^jitsi-meet-arm64\.AppImage$'
dest = "~/.local/bin/jitsi-meet.AppImage"
probe = false
