# Drafted from dagucloud/dagu's v2.26.0 release; its version is the one Upkeep installed.
[apps.dagu]
name = "dagu"
kind = "archive"
repo = "dagucloud/dagu"
asset = '^dagu_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^dagu_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/dagu"
bins = ["dagu"]
probe = false
