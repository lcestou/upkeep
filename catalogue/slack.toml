# Drafted from slackapi/slack-cli's v4.14.0 release; its version is the one Upkeep installed.
[apps.slack]
name = "Slack Cli"
kind = "archive"
repo = "slackapi/slack-cli"
asset = '^slack_cli_dev_linux_amd64\.tar\.gz$'
asset_aarch64 = '^slack_cli_dev_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/slack"
bins = ["bin/slack"]
probe = false
