# Drafted from ktr0731/evans's v0.10.11 release; its version is the one Upkeep installed.
[apps.evans]
name = "evans"
kind = "archive"
repo = "ktr0731/evans"
asset = '^evans_linux_amd64\.tar\.gz$'
asset_aarch64 = '^evans_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/evans"
bins = ["evans"]
probe = false
