# Drafted from cilium/cilium-cli's v0.20.3 release; its version is the one Upkeep installed.
[apps.cilium]
name = "Cilium Cli"
kind = "archive"
repo = "cilium/cilium-cli"
asset = '^cilium-linux-amd64\.tar\.gz$'
asset_aarch64 = '^cilium-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/cilium"
bins = ["cilium"]
probe = false
