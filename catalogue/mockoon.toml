# Drafted from mockoon/mockoon's v9.10.0 release; its version is the one Upkeep installed.
[apps.mockoon]
name = "mockoon"
kind = "appimage"
repo = "mockoon/mockoon"
asset = '^mockoon-.*\.x86_64\.AppImage$'
asset_aarch64 = '^mockoon-.*\.arm64\.AppImage$'
dest = "~/.local/bin/mockoon.AppImage"
probe = false
