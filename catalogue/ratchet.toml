# Drafted from sethvargo/ratchet's v0.12.0 release; its version is the one Upkeep installed.
[apps.ratchet]
name = "ratchet"
kind = "archive"
repo = "sethvargo/ratchet"
asset = '^ratchet_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ratchet_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ratchet"
bins = ["ratchet"]
probe = false
