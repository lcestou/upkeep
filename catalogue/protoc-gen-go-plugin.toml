# Drafted from knqyf263/go-plugin's v0.9.0 release; its version is the one Upkeep installed.
[apps.protoc-gen-go-plugin]
name = "Go Plugin"
kind = "archive"
repo = "knqyf263/go-plugin"
asset = '^go-plugin_.*_linux-amd64\.tar\.gz$'
asset_aarch64 = '^go-plugin_.*_linux-arm64\.tar\.gz$'
dest = "~/.local/bin/protoc-gen-go-plugin"
bins = ["protoc-gen-go-plugin"]
probe = false
