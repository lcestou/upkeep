# Drafted from diamondburned/dissent's v0.0.41 release; its version is the one Upkeep installed.
[apps.dissent]
name = "dissent"
kind = "archive"
repo = "diamondburned/dissent"
asset = '^dissent-linux-amd64\.tar\.zst$'
asset_aarch64 = '^dissent-linux-arm64\.tar\.zst$'
dest = "~/.local/bin/dissent"
folder = "~/.local/share/dissent"
bins = ["bin/dissent"]
probe = false
