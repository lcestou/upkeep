# Drafted from AtomicBot-ai/atomic-agent's v0.7.0 release; its version is the one Upkeep installed.
[apps.atomic-agent]
name = "Atomic Agent"
kind = "archive"
repo = "AtomicBot-ai/atomic-agent"
asset = '^atomic-agent-linux-x64\.tar\.gz$'
asset_aarch64 = '^atomic-agent-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/atomic-agent"
folder = "~/.local/share/atomic-agent"
bins = ["atomic-agent"]
probe = false
