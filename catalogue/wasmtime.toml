# Drafted from bytecodealliance/wasmtime's v50.0.1 release; its version is the one Upkeep installed.
[apps.wasmtime]
name = "wasmtime"
kind = "archive"
repo = "bytecodealliance/wasmtime"
asset = '^wasmtime-.*-x86_64-musl\.tar\.xz$'
asset_aarch64 = '^wasmtime-.*-aarch64-musl\.tar\.xz$'
dest = "~/.local/bin/wasmtime"
bins = ["wasmtime-v50.0.1-x86_64-musl/wasmtime", "wasmtime-v50.0.1-x86_64-musl/wasmtime-min"]
probe = false
