# Drafted from joshmedeski/sesh's v2.34.0 release; its version is the one Upkeep installed.
[apps.sesh]
name = "sesh"
kind = "archive"
repo = "joshmedeski/sesh"
asset = '^sesh_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^sesh_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/sesh"
bins = ["sesh"]
probe = false
