# Drafted from kubernetes/minikube's v1.39.0 release; its version is the one Upkeep installed.
[apps.minikube]
name = "minikube"
kind = "archive"
repo = "kubernetes/minikube"
asset = '^minikube-linux-amd64\.tar\.gz$'
asset_aarch64 = '^minikube-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/minikube"
bins = ["minikube*"]
probe = false
