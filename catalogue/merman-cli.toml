# Drafted from Latias94/merman's v0.10.0 release; its version is the one Upkeep installed.
[apps.merman-cli]
name = "merman"
kind = "archive"
repo = "Latias94/merman"
asset = '^merman-cli-x86_64-unknown-linux-gnu\.tar\.xz$'
asset_aarch64 = '^merman-cli-aarch64-unknown-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/merman-cli"
folder = "~/.local/share/merman-cli"
bins = ["merman-cli"]
probe = false
