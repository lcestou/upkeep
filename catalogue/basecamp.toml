# Drafted from basecamp/basecamp-cli's v0.30.0 release.
[apps.basecamp]
name = "Basecamp Cli"
kind = "archive"
repo = "basecamp/basecamp-cli"
asset = '^basecamp_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^basecamp_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/basecamp"
folder = "~/.local/share/basecamp"
bins = ["basecamp"]
