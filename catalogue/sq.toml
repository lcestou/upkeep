# Drafted from neilotoole/sq's v0.55.0 release; its version is the one Upkeep installed.
[apps.sq]
name = "sq"
kind = "archive"
repo = "neilotoole/sq"
asset = '^sq-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^sq-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/sq"
folder = "~/.local/share/sq"
bins = ["sq"]
probe = false
