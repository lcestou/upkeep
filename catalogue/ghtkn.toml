# Drafted from suzuki-shunsuke/ghtkn's v0.4.3 release; its version is the one Upkeep installed.
[apps.ghtkn]
name = "ghtkn"
kind = "archive"
repo = "suzuki-shunsuke/ghtkn"
asset = '^ghtkn_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ghtkn_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ghtkn"
bins = ["ghtkn"]
probe = false
