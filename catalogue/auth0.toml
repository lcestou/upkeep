# Drafted from auth0/auth0-cli's v1.39.0 release; its version is the one Upkeep installed.
[apps.auth0]
name = "Auth0 Cli"
kind = "archive"
repo = "auth0/auth0-cli"
asset = '^auth0-cli_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^auth0-cli_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/auth0"
bins = ["auth0"]
probe = false
