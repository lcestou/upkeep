# Drafted from concourse/concourse's v8.3.3 release; its version is the one Upkeep installed.
[apps.fly]
name = "concourse"
kind = "archive"
repo = "concourse/concourse"
asset = '^fly-.*-linux-amd64\.tgz$'
asset_aarch64 = '^fly-.*-linux-arm64\.tgz$'
dest = "~/.local/bin/fly"
bins = ["fly"]
probe = false
