# Drafted from Gaurav-Gosain/tuios's v0.13.1 release; its version is the one Upkeep installed.
[apps.tuios]
name = "tuios"
kind = "archive"
repo = "Gaurav-Gosain/tuios"
asset = '^tuios_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^tuios_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tuios"
bins = ["tuios"]
probe = false
