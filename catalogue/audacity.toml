# Drafted from audacity/audacity's Audacity-4.0.2 release.
[apps.audacity]
name = "audacity"
kind = "appimage"
repo = "audacity/audacity"
asset = '^audacity-linux-.*-x86_64\.AppImage$'
asset_aarch64 = '^audacity-linux-.*-aarch64\.AppImage$'
dest = "~/.local/bin/audacity.AppImage"
meta_path = "usr/share/metainfo/org.audacityteam.Audacity4portable.appdata.xml"
