# Drafted from helmfile/vals's v0.51.1 release; its version is the one Upkeep installed.
[apps.vals]
name = "vals"
kind = "archive"
repo = "helmfile/vals"
asset = '^vals_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^vals_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/vals"
bins = ["vals"]
probe = false
