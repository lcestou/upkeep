# Drafted from creativeprojects/resticprofile's v0.34.0 release; its version is the one Upkeep installed.
[apps.resticprofile]
name = "resticprofile"
kind = "archive"
repo = "creativeprojects/resticprofile"
asset = '^resticprofile_[0-9][0-9A-Za-z.]*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^resticprofile_[0-9][0-9A-Za-z.]*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/resticprofile"
bins = ["resticprofile"]
probe = false
