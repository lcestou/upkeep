# Drafted from igor-alexandrov/tabletist's v0.6.1 release.
[apps.tabletist]
name = "tabletist"
kind = "appimage"
repo = "igor-alexandrov/tabletist"
asset = '^tabletist-.*-x86_64\.AppImage$'
