# Drafted from Skarlso/crd-to-sample-yaml's v2.7.0 release; its version is the one Upkeep installed.
[apps.cty]
name = "Crd To Sample Yaml"
kind = "archive"
repo = "Skarlso/crd-to-sample-yaml"
asset = '^cty_linux_amd64\.tar\.gz$'
asset_aarch64 = '^cty_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/cty"
bins = ["cty"]
probe = false
