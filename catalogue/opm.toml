# Drafted from operator-framework/operator-registry's v2.0.0-alpha-3 release; its version is the one Upkeep installed.
[apps.opm]
name = "Operator Registry"
kind = "file"
repo = "operator-framework/operator-registry"
asset = '^linux-amd64-opm$'
asset_aarch64 = '^linux-arm64-opm$'
dest = "~/.local/bin/opm"
probe = false
