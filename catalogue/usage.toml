# Drafted from jdx/usage's v7.3.0 release; its version is the one Upkeep installed.
[apps.usage]
name = "usage"
kind = "archive"
repo = "jdx/usage"
asset = '^usage-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^usage-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/usage"
bins = ["usage"]
probe = false
