# Drafted from emanuele-em/proxelar's v0.6.1 release; its version is the one Upkeep installed.
[apps.proxelar]
name = "proxelar"
kind = "archive"
repo = "emanuele-em/proxelar"
asset = '^proxelar-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^proxelar-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/proxelar"
bins = ["proxelar"]
probe = false
