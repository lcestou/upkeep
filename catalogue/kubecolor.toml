# Drafted from kubecolor/kubecolor's v0.8.0 release.
[apps.kubecolor]
name = "kubecolor"
kind = "archive"
repo = "kubecolor/kubecolor"
asset = '^kubecolor_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kubecolor_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubecolor"
bins = ["kubecolor"]
version_args = ["--kubecolor-version"]
