# Drafted from adil192/ricochlime's v1.14.0 release; its version is the one Upkeep installed.
[apps.ricochlime]
name = "Ricochlime"
kind = "appimage"
repo = "adil192/ricochlime"
asset = '^Ricochlime-.*-x86_64\.AppImage$'
asset_aarch64 = '^Ricochlime-.*-arm64\.AppImage$'
dest = "~/.local/bin/ricochlime.AppImage"
probe = false
