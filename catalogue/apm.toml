# Drafted from microsoft/apm's v0.35.1 release; its version is the one Upkeep installed.
[apps.apm]
name = "apm"
kind = "archive"
repo = "microsoft/apm"
asset = '^apm-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^apm-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/apm"
folder = "~/.local/share/apm"
bins = ["apm"]
probe = false
