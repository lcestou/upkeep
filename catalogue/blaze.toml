# Drafted from indexable-inc/blaze's v0.20261027.0 release; its version is the one Upkeep installed.
[apps.blaze]
name = "blaze"
kind = "archive"
repo = "indexable-inc/blaze"
asset = '^blaze-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^blaze-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/blaze"
folder = "~/.local/share/blaze"
bins = ["blaze", "blaze-proc-macro-srv"]
probe = false
