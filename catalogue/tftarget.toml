# Drafted from future-architect/tftarget's v0.0.9 release; its version is the one Upkeep installed.
[apps.tftarget]
name = "tftarget"
kind = "archive"
repo = "future-architect/tftarget"
asset = '^tftarget_.*_linux_amd64\.zip$'
asset_aarch64 = '^tftarget_.*_linux_arm64\.zip$'
dest = "~/.local/bin/tftarget"
bins = ["tftarget"]
probe = false
