# Drafted from Shopify/shadowenv's 3.6.0 release; its version is the one Upkeep installed.
[apps.shadowenv]
name = "shadowenv"
kind = "file"
repo = "Shopify/shadowenv"
asset = '^shadowenv-x86_64-unknown-linux-gnu$'
asset_aarch64 = '^shadowenv-aarch64-unknown-linux-gnu$'
dest = "~/.local/bin/shadowenv"
probe = false
