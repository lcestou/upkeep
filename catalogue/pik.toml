# Drafted from jacek-kurlit/pik's 1.0.1 release; its version is the one Upkeep installed.
[apps.pik]
name = "pik"
kind = "archive"
repo = "jacek-kurlit/pik"
asset = '^pik-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^pik-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/pik"
bins = ["pik-1.0.1-x86_64-unknown-linux-gnu/pik"]
probe = false
