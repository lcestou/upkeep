# Drafted from tsuru/tsuru-client's v1.38.1 release.
[apps.tsuru]
name = "Tsuru Client"
kind = "archive"
repo = "tsuru/tsuru-client"
asset = '^tsuru_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tsuru_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tsuru"
folder = "~/.local/share/tsuru"
bins = ["tsuru"]
version_args = ["version"]
