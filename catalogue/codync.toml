# Drafted from leepokai/Codync's v2.47.0 release; its version is the one Upkeep installed.
[apps.codync]
name = "Codync"
kind = "appimage"
repo = "leepokai/Codync"
asset = '^codync-linux-x86_64\.AppImage$'
asset_aarch64 = '^codync-linux-arm64\.AppImage$'
dest = "~/.local/bin/codync.AppImage"
probe = false
