# Drafted from babarot/gh-infra's v0.20.0 release; its version is the one Upkeep installed.
[apps.gh-infra]
name = "Gh Infra"
kind = "archive"
repo = "babarot/gh-infra"
asset = '^gh-infra_linux_amd64\.tar\.gz$'
asset_aarch64 = '^gh-infra_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gh-infra"
bins = ["gh-infra"]
probe = false
