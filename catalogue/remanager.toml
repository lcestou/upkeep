# Drafted from rmitchellscott/reManager's v2.0.1 release; its version is the one Upkeep installed.
[apps.remanager]
name = "reManager"
kind = "archive"
repo = "rmitchellscott/reManager"
asset = '^reManager-linux-amd64\.tar\.gz$'
asset_aarch64 = '^reManager-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/reManager"
bins = ["reManager"]
probe = false
