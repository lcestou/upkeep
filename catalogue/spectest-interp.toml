# Drafted from WebAssembly/wabt's 1.0.42 release.
[apps.spectest-interp]
name = "wabt"
kind = "archive"
repo = "WebAssembly/wabt"
asset = '^wabt-.*-linux-x64\.tar\.gz$'
asset_aarch64 = '^wabt-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/spectest-interp"
folder = "~/.local/share/spectest-interp"
bins = ["bin/spectest-interp"]
