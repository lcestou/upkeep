# Drafted from kubernetes-sigs/cloud-provider-kind's v0.12.0 release; its version is the one Upkeep installed.
[apps.cloud-provider-kind]
name = "Cloud Provider Kind"
kind = "archive"
repo = "kubernetes-sigs/cloud-provider-kind"
asset = '^cloud-provider-kind_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^cloud-provider-kind_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/cloud-provider-kind"
bins = ["cloud-provider-kind"]
probe = false
