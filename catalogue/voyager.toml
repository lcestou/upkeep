# Drafted from aeharding/voyager's 2.49.1 release; its version is the one Upkeep installed.
[apps.voyager]
name = "Voyager"
kind = "appimage"
repo = "aeharding/voyager"
asset = '^Voyager-Linux-x86_64-.*\.AppImage$'
asset_aarch64 = '^Voyager-Linux-aarch64-.*\.AppImage$'
dest = "~/.local/bin/voyager.AppImage"
probe = false
