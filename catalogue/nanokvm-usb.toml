# Drafted from sipeed/NanoKVM-USB's v1.1.4 release; its version is the one Upkeep installed.
[apps.nanokvm-usb]
name = "NanoKVM-USB"
kind = "appimage"
repo = "sipeed/NanoKVM-USB"
asset = '^NanoKVM-USB-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^NanoKVM-USB-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/nanokvm-usb.AppImage"
probe = false
