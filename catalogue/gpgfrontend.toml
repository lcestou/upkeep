# Drafted from saturneric/GpgFrontend's v2.2.4 release; its version is the one Upkeep installed.
[apps.gpgfrontend]
name = "GpgFrontend"
kind = "appimage"
repo = "saturneric/GpgFrontend"
asset = '^GpgFrontend-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^GpgFrontend-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/gpgfrontend.AppImage"
probe = false
