# Drafted from arxanas/git-branchless's v0.11.1 release.
[apps.git-branchless]
name = "Git Branchless"
kind = "archive"
repo = "arxanas/git-branchless"
asset = '^git-branchless-.*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^git-branchless-.*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/git-branchless"
bins = ["git-branchless"]
