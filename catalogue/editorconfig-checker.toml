# Drafted from editorconfig-checker/editorconfig-checker's v4.0.2 release; its version is the one Upkeep installed.
[apps.editorconfig-checker]
name = "Editorconfig Checker"
kind = "archive"
repo = "editorconfig-checker/editorconfig-checker"
asset = '^editorconfig-checker-linux-amd64\.tar\.gz$'
asset_aarch64 = '^editorconfig-checker-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/editorconfig-checker"
bins = ["editorconfig-checker"]
probe = false
