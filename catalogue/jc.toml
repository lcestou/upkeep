# Drafted from kellyjonbrazil/jc's v1.26.2 release; its version is the one Upkeep installed.
[apps.jc]
name = "jc"
kind = "archive"
repo = "kellyjonbrazil/jc"
asset = '^jc-.*-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^jc-.*-linux-aarch64\.tar\.gz$'
dest = "~/.local/bin/jc"
bins = ["jc"]
probe = false
