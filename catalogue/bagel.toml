# Drafted from boostsecurityio/bagel's v0.7.1 release; its version is the one Upkeep installed.
[apps.bagel]
name = "bagel"
kind = "archive"
repo = "boostsecurityio/bagel"
asset = '^bagel_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^bagel_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/bagel"
bins = ["bagel"]
probe = false
