# Drafted from alvinunreal/tmuxai's v2.5.0 release; its version is the one Upkeep installed.
[apps.tmuxai]
name = "tmuxai"
kind = "archive"
repo = "alvinunreal/tmuxai"
asset = '^tmuxai_Linux_amd64\.tar\.gz$'
asset_aarch64 = '^tmuxai_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tmuxai"
bins = ["tmuxai"]
probe = false
