# Drafted from google-antigravity/antigravity-cli's 1.5.9 release; its version is the one Upkeep installed.
[apps.antigravity]
name = "Antigravity Cli"
kind = "archive"
repo = "google-antigravity/antigravity-cli"
asset = '^agy_cli_linux_x64_musl\.tar\.gz$'
asset_aarch64 = '^agy_cli_linux_arm64_musl\.tar\.gz$'
dest = "~/.local/bin/antigravity"
bins = ["antigravity"]
probe = false
