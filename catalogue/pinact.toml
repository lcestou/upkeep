# Drafted from suzuki-shunsuke/pinact's v5.0.2 release; its version is the one Upkeep installed.
[apps.pinact]
name = "pinact"
kind = "archive"
repo = "suzuki-shunsuke/pinact"
asset = '^pinact_linux_amd64\.tar\.gz$'
asset_aarch64 = '^pinact_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/pinact"
folder = "~/.local/share/pinact"
bins = ["pinact"]
probe = false
