# Drafted from solidiquis/erdtree's v3.1.2 release; its version is the one Upkeep installed.
[apps.erd]
name = "erdtree"
kind = "archive"
repo = "solidiquis/erdtree"
asset = '^erd-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^erd-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/erd"
bins = ["erd"]
probe = false
