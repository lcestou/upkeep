# Drafted from ktock/buildg's v0.5.3 release; its version is the one Upkeep installed.
[apps.buildg]
name = "buildg"
kind = "archive"
repo = "ktock/buildg"
asset = '^buildg-v[0-9][0-9A-Za-z.]*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^buildg-v[0-9][0-9A-Za-z.]*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/buildg"
bins = ["buildg"]
probe = false
