# Drafted from typst/typst's v0.15.1 release; its version is the one Upkeep installed.
[apps.typst]
name = "typst"
kind = "archive"
repo = "typst/typst"
asset = '^typst-x86_64-unknown-linux-musl\.tar\.xz$'
asset_aarch64 = '^typst-aarch64-unknown-linux-musl\.tar\.xz$'
dest = "~/.local/bin/typst"
bins = ["typst-x86_64-unknown-linux-musl/typst"]
probe = false
