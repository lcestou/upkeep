# Drafted from pimalaya/himalaya's v2.2.1 release; its version is the one Upkeep installed.
[apps.himalaya]
name = "himalaya"
kind = "archive"
repo = "pimalaya/himalaya"
asset = '^himalaya\.x86_64-linux\.tgz$'
asset_aarch64 = '^himalaya\.aarch64-linux\.tgz$'
dest = "~/.local/bin/himalaya"
folder = "~/.local/share/himalaya"
bins = ["himalaya"]
probe = false
