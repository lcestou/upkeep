# Drafted from zwasm/zwasm's v2.11.1 release; its version is the one Upkeep installed.
[apps.zwasm]
name = "zwasm"
kind = "archive"
repo = "zwasm/zwasm"
asset = '^zwasm-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^zwasm-linux-aarch64\.tar\.gz$'
dest = "~/.local/bin/zwasm"
bins = ["zwasm"]
probe = false
