# Drafted from Auto-Explore/GitComet's v0.3.4 release; its version is the one Upkeep installed.
[apps.gitcomet]
name = "GitComet"
kind = "appimage"
repo = "Auto-Explore/GitComet"
asset = '^gitcomet-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^gitcomet-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/gitcomet.AppImage"
probe = false
