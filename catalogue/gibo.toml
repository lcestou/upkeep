# Drafted from simonwhitaker/gibo's v3.0.23 release; its version is the one Upkeep installed.
[apps.gibo]
name = "gibo"
kind = "archive"
repo = "simonwhitaker/gibo"
asset = '^gibo_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^gibo_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gibo"
bins = ["gibo"]
probe = false
