# Drafted from tursodatabase/turso-cli's v1.0.34 release; its version is the one Upkeep installed.
[apps.turso]
name = "Turso Cli"
kind = "archive"
repo = "tursodatabase/turso-cli"
asset = '^turso-cli_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^turso-cli_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/turso"
bins = ["turso"]
probe = false
