# Drafted from sandbox-quantum/switch's switch-console-v0.40.1 release; its version is the one Upkeep installed.
[apps.switch-console]
name = "switch"
kind = "appimage"
repo = "sandbox-quantum/switch"
asset = '^switch-console-x86_64\.AppImage$'
asset_aarch64 = '^switch-console-arm64\.AppImage$'
dest = "~/.local/bin/switch-console.AppImage"
probe = false
