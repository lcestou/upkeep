# Drafted from quarylabs/sqruff's v0.44.0 release; its version is the one Upkeep installed.
[apps.sqruff]
name = "sqruff"
kind = "archive"
repo = "quarylabs/sqruff"
asset = '^sqruff-linux-x86_64-musl\.tar\.gz$'
asset_aarch64 = '^sqruff-linux-aarch64-musl\.tar\.gz$'
dest = "~/.local/bin/sqruff"
bins = ["sqruff"]
probe = false
