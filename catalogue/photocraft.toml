# Drafted from storytold/photocraft's v0.23.1 release; its version is the one Upkeep installed.
[apps.photocraft]
name = "photocraft"
kind = "appimage"
repo = "storytold/photocraft"
asset = '^photocraft-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^photocraft-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/photocraft.AppImage"
probe = false
