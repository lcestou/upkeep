# Drafted from microsoft/aspire's v13.6.5 release; its version is the one Upkeep installed.
[apps.aspire]
name = "aspire"
kind = "archive"
repo = "microsoft/aspire"
asset = '^aspire-cli-linux-musl-x64-.*\.tar\.gz$'
dest = "~/.local/bin/aspire"
folder = "~/.local/share/aspire"
bins = ["aspire"]
probe = false
