# Drafted from sheeki03/tirith's v0.5.0 release; its version is the one Upkeep installed.
[apps.tirith]
name = "tirith"
kind = "archive"
repo = "sheeki03/tirith"
asset = '^tirith-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^tirith-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/tirith"
bins = ["tirith", "tirith-package-approval-authority"]
probe = false
