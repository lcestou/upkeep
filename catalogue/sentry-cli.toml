# Drafted from getsentry/sentry-cli's 3.8.2 release; its version is the one Upkeep installed.
[apps.sentry-cli]
name = "Sentry Cli"
kind = "archive"
repo = "getsentry/sentry-cli"
asset = '^sentry-cli-linux-x64-.*\.tgz$'
asset_aarch64 = '^sentry-cli-linux-arm64-.*\.tgz$'
dest = "~/.local/bin/sentry-cli"
folder = "~/.local/share/sentry-cli"
bins = ["bin/sentry-cli"]
probe = false
