# Drafted from KloBraticc/Voidstrap's v1.1.3.7 release; its version is the one Upkeep installed.
[apps.voidstrap]
name = "Voidstrap"
kind = "appimage"
repo = "KloBraticc/Voidstrap"
asset = '^Voidstrap_.*_x86_64\.AppImage$'
asset_aarch64 = '^Voidstrap_.*_aarch64\.AppImage$'
dest = "~/.local/bin/voidstrap.AppImage"
probe = false
