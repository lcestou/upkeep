# Drafted from mq1/TinyWiiBackupManager's v6.2.0 release; its version is the one Upkeep installed.
[apps.tinywiibackupmanager]
name = "TinyWiiBackupManager"
kind = "appimage"
repo = "mq1/TinyWiiBackupManager"
asset = '^TinyWiiBackupManager-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^TinyWiiBackupManager-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/tinywiibackupmanager.AppImage"
probe = false
