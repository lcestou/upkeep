# Drafted from krille-chan/fluffychat's v2.11.5 release; its version is the one Upkeep installed.
[apps.fluffychat]
name = "fluffychat"
kind = "archive"
repo = "krille-chan/fluffychat"
asset = '^fluffychat-linux-x64\.tar\.gz$'
asset_aarch64 = '^fluffychat-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/fluffychat"
folder = "~/.local/share/fluffychat"
bins = ["fluffychat"]
probe = false
