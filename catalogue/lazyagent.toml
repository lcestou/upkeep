# Drafted from illegalstudio/lazyagent's v0.16.0 release; its version is the one Upkeep installed.
[apps.lazyagent]
name = "Lazyagent"
kind = "appimage"
repo = "illegalstudio/lazyagent"
asset = '^Lazyagent_.*_linux_amd64\.AppImage$'
asset_aarch64 = '^Lazyagent_.*_linux_arm64\.AppImage$'
dest = "~/.local/bin/lazyagent.AppImage"
probe = false
