# Drafted from wakatara/harsh's v0.14.5 release; its version is the one Upkeep installed.
[apps.harsh]
name = "harsh"
kind = "archive"
repo = "wakatara/harsh"
asset = '^harsh_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^harsh_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/harsh"
bins = ["harsh"]
probe = false
