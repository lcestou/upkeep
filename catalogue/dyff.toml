# Drafted from homeport/dyff's v1.12.0 release; its version is the one Upkeep installed.
[apps.dyff]
name = "dyff"
kind = "archive"
repo = "homeport/dyff"
asset = '^dyff_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^dyff_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/dyff"
bins = ["dyff"]
probe = false
