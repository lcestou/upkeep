# Drafted from chanzuckerberg/fogg's v0.92.55 release; its version is the one Upkeep installed.
[apps.fogg]
name = "fogg"
kind = "archive"
repo = "chanzuckerberg/fogg"
asset = '^fogg_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^fogg_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/fogg"
bins = ["fogg"]
probe = false
