# Drafted from sachaos/todoist's v0.25.0 release; its version is the one Upkeep installed.
[apps.todoist]
name = "todoist"
kind = "archive"
repo = "sachaos/todoist"
asset = '^todoist_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^todoist_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/todoist"
folder = "~/.local/share/todoist"
bins = ["todoist"]
probe = false
