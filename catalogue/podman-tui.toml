# Drafted from containers/podman-tui's v2.0.0 release; its version is the one Upkeep installed.
[apps.podman-tui]
name = "Podman Tui"
kind = "archive"
repo = "containers/podman-tui"
asset = '^podman-tui-release-linux_amd64\.zip$'
asset_aarch64 = '^podman-tui-release-linux_arm64\.zip$'
dest = "~/.local/bin/podman-tui"
bins = ["podman-tui-v2.0.0/podman-tui"]
probe = false
