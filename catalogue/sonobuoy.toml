# Drafted from vmware-tanzu/sonobuoy's v0.57.5 release.
[apps.sonobuoy]
name = "sonobuoy"
kind = "archive"
repo = "vmware-tanzu/sonobuoy"
asset = '^sonobuoy_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^sonobuoy_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/sonobuoy"
bins = ["sonobuoy"]
version_args = ["version"]
