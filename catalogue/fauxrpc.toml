# Drafted from sudorandom/fauxrpc's v0.30.0 release; its version is the one Upkeep installed.
[apps.fauxrpc]
name = "fauxrpc"
kind = "archive"
repo = "sudorandom/fauxrpc"
asset = '^fauxrpc_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^fauxrpc_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/fauxrpc"
bins = ["fauxrpc"]
probe = false
