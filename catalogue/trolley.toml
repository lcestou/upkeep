# Drafted from weedonandscott/trolley's v0.12.0 release; its version is the one Upkeep installed.
[apps.trolley]
name = "trolley"
kind = "archive"
repo = "weedonandscott/trolley"
asset = '^trolley-cli-x86_64-linux\.tar\.xz$'
asset_aarch64 = '^trolley-cli-aarch64-linux\.tar\.xz$'
dest = "~/.local/bin/trolley"
bins = ["trolley"]
probe = false
