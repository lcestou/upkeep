# Drafted from int128/kubelogin's v1.36.4 release; its version is the one Upkeep installed.
[apps.kubelogin]
name = "kubelogin"
kind = "archive"
repo = "int128/kubelogin"
asset = '^kubelogin_linux_amd64\.zip$'
asset_aarch64 = '^kubelogin_linux_arm64\.zip$'
dest = "~/.local/bin/kubelogin"
bins = ["kubelogin"]
probe = false
