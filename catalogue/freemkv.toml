# Drafted from freemkv/freemkv's v1.8.9 release; its version is the one Upkeep installed.
[apps.freemkv]
name = "freemkv"
kind = "appimage"
repo = "freemkv/freemkv"
asset = '^freemkv-x86_64-linux\.AppImage$'
asset_aarch64 = '^freemkv-aarch64-linux\.AppImage$'
dest = "~/.local/bin/freemkv.AppImage"
probe = false
