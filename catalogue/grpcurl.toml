# Drafted from fullstorydev/grpcurl's v1.9.4 release; its version is the one Upkeep installed.
[apps.grpcurl]
name = "grpcurl"
kind = "archive"
repo = "fullstorydev/grpcurl"
asset = '^grpcurl_.*_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^grpcurl_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/grpcurl"
bins = ["grpcurl"]
probe = false
