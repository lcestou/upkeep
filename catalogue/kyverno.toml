# Drafted from kyverno/kyverno's v1.20.0 release; its version is the one Upkeep installed.
[apps.kyverno]
name = "kyverno"
kind = "archive"
repo = "kyverno/kyverno"
asset = '^kyverno-cli_.*_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^kyverno-cli_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kyverno"
bins = ["kyverno"]
probe = false
