# Drafted from openBitFun/OpenBitFun's v1.0.10 release; its version is the one Upkeep installed.
[apps.openbitfun]
name = "OpenBitFun"
kind = "appimage"
repo = "openBitFun/OpenBitFun"
asset = '^OpenBitFun_.*_linux-x86_64\.AppImage$'
asset_aarch64 = '^OpenBitFun_.*_linux-aarch64\.AppImage$'
dest = "~/.local/bin/openbitfun.AppImage"
probe = false
