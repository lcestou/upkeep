# Drafted from deviceinsight/kafkactl's v5.21.0 release.
[apps.kafkactl]
name = "kafkactl"
kind = "archive"
repo = "deviceinsight/kafkactl"
asset = '^kafkactl_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kafkactl_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kafkactl"
bins = ["kafkactl"]
version_args = ["version"]
