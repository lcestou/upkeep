# Drafted from wistoff/legacy-scrobbler's v1.0.7 release; its version is the one Upkeep installed.
[apps.legacy-scrobbler]
name = "Legacy-Scrobbler"
kind = "appimage"
repo = "wistoff/legacy-scrobbler"
asset = '^Legacy\.Scrobbler-.*-x64\.AppImage$'
dest = "~/.local/bin/legacy-scrobbler.AppImage"
probe = false
