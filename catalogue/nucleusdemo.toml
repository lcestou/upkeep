# Drafted from NucleusFramework/Nucleus's v2.5.18 release; its version is the one Upkeep installed.
[apps.nucleusdemo]
name = "Nucleus"
kind = "appimage"
repo = "NucleusFramework/Nucleus"
asset = '^nucleusdemo-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^nucleusdemo-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/nucleusdemo.AppImage"
probe = false
