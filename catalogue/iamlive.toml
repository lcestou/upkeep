# Drafted from iann0036/iamlive's v1.1.28 release; its version is the one Upkeep installed.
[apps.iamlive]
name = "iamlive"
kind = "archive"
repo = "iann0036/iamlive"
asset = '^iamlive_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^iamlive_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/iamlive"
bins = ["iamlive"]
probe = false
