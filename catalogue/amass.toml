# Drafted from owasp-amass/amass's v5.1.3 release; its version is the one Upkeep installed.
[apps.amass]
name = "amass"
kind = "archive"
repo = "owasp-amass/amass"
asset = '^amass_linux_amd64\.tar\.gz$'
asset_aarch64 = '^amass_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/amass"
folder = "~/.local/share/amass"
bins = ["amass"]
probe = false
