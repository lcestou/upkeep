# Drafted from magodo/pipeform's v0.2.1 release; its version is the one Upkeep installed.
[apps.pipeform]
name = "pipeform"
kind = "archive"
repo = "magodo/pipeform"
asset = '^pipeform_.*_linux_amd64\.zip$'
asset_aarch64 = '^pipeform_.*_linux_arm64\.zip$'
dest = "~/.local/bin/pipeform"
bins = ["pipeform"]
probe = false
