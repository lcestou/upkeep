# Drafted from turbot/flowpipe's v1.2.4 release; its version is the one Upkeep installed.
[apps.flowpipe]
name = "flowpipe"
kind = "archive"
repo = "turbot/flowpipe"
asset = '^flowpipe\.linux\.amd64\.tar\.gz$'
asset_aarch64 = '^flowpipe\.linux\.arm64\.tar\.gz$'
dest = "~/.local/bin/flowpipe"
bins = ["flowpipe"]
probe = false
