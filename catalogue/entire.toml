# Drafted from entireio/cli's v0.13.4 release; its version is the one Upkeep installed.
[apps.entire]
name = "entireio"
kind = "archive"
repo = "entireio/cli"
asset = '^entire_linux_amd64\.tar\.gz$'
asset_aarch64 = '^entire_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/entire"
bins = ["entire"]
probe = false
