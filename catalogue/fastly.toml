# Drafted from fastly/cli's v17.1.0 release; its version is the one Upkeep installed.
[apps.fastly]
name = "fastly"
kind = "archive"
repo = "fastly/cli"
asset = '^fastly_.*_linux-amd64\.tar\.gz$'
asset_aarch64 = '^fastly_.*_linux-arm64\.tar\.gz$'
dest = "~/.local/bin/fastly"
bins = ["fastly"]
probe = false
