# Drafted from dhall-lang/dhall-haskell's 1.42.2 release; its version is the one Upkeep installed.
[apps.dhall]
name = "Dhall Haskell"
kind = "archive"
repo = "dhall-lang/dhall-haskell"
asset = '^dhall-[0-9][0-9A-Za-z.]*-x86_64-linux\.tar\.bz2$'
dest = "~/.local/bin/dhall"
bins = ["bin/dhall"]
probe = false
