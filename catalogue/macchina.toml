# Drafted from Macchina-CLI/macchina's v6.4.0 release; its version is the one Upkeep installed.
[apps.macchina]
name = "macchina"
kind = "archive"
repo = "Macchina-CLI/macchina"
asset = '^macchina-.*-linux-gnu-x86_64\.tar\.gz$'
asset_aarch64 = '^macchina-.*-linux-gnu-aarch64\.tar\.gz$'
dest = "~/.local/bin/macchina"
bins = ["macchina"]
probe = false
