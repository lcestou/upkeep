# Drafted from mrjackwills/oxker's v0.13.4 release; its version is the one Upkeep installed.
[apps.oxker]
name = "oxker"
kind = "archive"
repo = "mrjackwills/oxker"
asset = '^oxker_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^oxker_linux_aarch64\.tar\.gz$'
dest = "~/.local/bin/oxker"
bins = ["oxker"]
probe = false
