# Drafted from duckdb/duckdb's v2.0.0 release; its version is the one Upkeep installed.
[apps.duckdb]
name = "duckdb"
kind = "archive"
repo = "duckdb/duckdb"
asset = '^duckdb-cli-linux-amd64-musl\.tar\.gz$'
asset_aarch64 = '^duckdb-cli-linux-arm64-musl\.tar\.gz$'
dest = "~/.local/bin/duckdb"
bins = ["duckdb"]
probe = false
