# Drafted from nats-io/natscli's v0.5.1 release; its version is the one Upkeep installed.
[apps.nats]
name = "natscli"
kind = "archive"
repo = "nats-io/natscli"
asset = '^nats-.*-linux-amd64\.zip$'
asset_aarch64 = '^nats-.*-linux-arm64\.zip$'
dest = "~/.local/bin/nats"
bins = ["nats-0.5.1-linux-amd64/nats"]
probe = false
