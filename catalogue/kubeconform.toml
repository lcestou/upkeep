# Drafted from yannh/kubeconform's v0.8.0 release.
[apps.kubeconform]
name = "kubeconform"
kind = "archive"
repo = "yannh/kubeconform"
asset = '^kubeconform-linux-amd64\.tar\.gz$'
asset_aarch64 = '^kubeconform-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/kubeconform"
bins = ["kubeconform"]
version_args = ["-v"]
