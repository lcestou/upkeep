# Drafted from BishopFox/cloudfox's v2.0.5 release; its version is the one Upkeep installed.
[apps.cloudfox]
name = "cloudfox"
kind = "archive"
repo = "BishopFox/cloudfox"
asset = '^cloudfox-linux-amd64\.zip$'
asset_aarch64 = '^cloudfox-linux-arm64\.zip$'
dest = "~/.local/bin/cloudfox"
bins = ["cloudfox/cloudfox"]
probe = false
