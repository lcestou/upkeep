# Drafted from elastic/crd-ref-docs's v0.3.0 release; its version is the one Upkeep installed.
[apps.crd-ref-docs]
name = "Crd Ref Docs"
kind = "archive"
repo = "elastic/crd-ref-docs"
asset = '^crd-ref-docs_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^crd-ref-docs_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/crd-ref-docs"
bins = ["crd-ref-docs"]
probe = false
