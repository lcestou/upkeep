# Drafted from runxhq/runx's cli-v0.11.1 release; its version is the one Upkeep installed.
[apps.runx]
name = "runx"
kind = "archive"
repo = "runxhq/runx"
asset = '^runx-.*-x86_64-unknown-linux-musl\.tar\.gz$'
asset_aarch64 = '^runx-.*-aarch64-unknown-linux-musl\.tar\.gz$'
dest = "~/.local/bin/runx"
bins = ["runx-0.11.1-x86_64-unknown-linux-musl/runx", "runx-0.11.1-x86_64-unknown-linux-musl/runx-js-worker"]
probe = false
