# Drafted from laggykiller/sticker-convert's v2.21.0.3 release; its version is the one Upkeep installed.
[apps.sticker-convert]
name = "Sticker Convert"
kind = "appimage"
repo = "laggykiller/sticker-convert"
asset = '^sticker-convert-x86_64\.AppImage$'
