# Drafted from blacknon/hwatch's 0.4.2 release; its version is the one Upkeep installed.
[apps.hwatch]
name = "hwatch"
kind = "archive"
repo = "blacknon/hwatch"
asset = '^hwatch-.*\.x86_64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/hwatch"
folder = "~/.local/share/hwatch"
bins = ["bin/hwatch"]
probe = false
