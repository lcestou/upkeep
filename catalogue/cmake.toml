# Drafted from Kitware/CMake's v4.5.0 release.
[apps.cmake]
name = "CMake"
kind = "archive"
repo = "Kitware/CMake"
asset = '^cmake-.*-linux-x86_64\.tar\.gz$'
asset_aarch64 = '^cmake-.*-linux-aarch64\.tar\.gz$'
dest = "~/.local/bin/cmake"
folder = "~/.local/share/cmake"
bins = ["bin/cmake", "bin/cmake-gui"]
