# Drafted from tagspaces/tagspaces's v6.14.3 release.
[apps.tagspaces]
name = "tagspaces"
kind = "appimage"
repo = "tagspaces/tagspaces"
asset = '^tagspaces-linux-x86_64-.*\.AppImage$'
