# Drafted from edisionnano/QDiskInfo's 0.4 release; its version is the one Upkeep installed.
[apps.qdiskinfo]
name = "QDiskInfo"
kind = "appimage"
repo = "edisionnano/QDiskInfo"
asset = '^QDiskInfo-x86_64\.AppImage$'
asset_aarch64 = '^QDiskInfo-aarch64\.AppImage$'
dest = "~/.local/bin/qdiskinfo.AppImage"
probe = false
