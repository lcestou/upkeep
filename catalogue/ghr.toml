# Drafted from tcnksm/ghr's v0.18.6 release; its version is the one Upkeep installed.
[apps.ghr]
name = "ghr"
kind = "archive"
repo = "tcnksm/ghr"
asset = '^ghr_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ghr_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ghr"
folder = "~/.local/share/ghr"
bins = ["ghr"]
probe = false
