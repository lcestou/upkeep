# Drafted from mxmlnkn/ratarmount's v1.3.0 release; its version is the one Upkeep installed.
[apps.ratarmount]
name = "ratarmount"
kind = "appimage"
repo = "mxmlnkn/ratarmount"
asset = '^ratarmount-[0-9][0-9A-Za-z.]*-x86_64\.AppImage$'
asset_aarch64 = '^ratarmount-[0-9][0-9A-Za-z.]*-aarch64\.AppImage$'
dest = "~/.local/bin/ratarmount.AppImage"
probe = false
