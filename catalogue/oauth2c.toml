# Drafted from SecureAuthCorp/oauth2c's v1.21.1 release.
[apps.oauth2c]
name = "oauth2c"
kind = "archive"
repo = "SecureAuthCorp/oauth2c"
asset = '^oauth2c_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^oauth2c_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/oauth2c"
bins = ["oauth2c"]
version_args = ["version"]
