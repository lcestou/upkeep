# Drafted from taiki-e/cargo-llvm-cov's v0.9.1 release; its version is the one Upkeep installed.
[apps.cargo-llvm-cov]
name = "Cargo Llvm Cov"
kind = "archive"
repo = "taiki-e/cargo-llvm-cov"
asset = '^cargo-llvm-cov-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^cargo-llvm-cov-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/cargo-llvm-cov"
bins = ["cargo-llvm-cov"]
probe = false
