# Drafted from desktop-plus/desktop-plus's v3.6.11.0 release; its version is the one Upkeep installed.
[apps.desktopplus]
name = "DesktopPlus"
kind = "appimage"
repo = "desktop-plus/desktop-plus"
asset = '^DesktopPlus-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^DesktopPlus-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/desktopplus.AppImage"
probe = false
