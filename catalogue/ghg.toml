# Drafted from Songmu/ghg's v0.3.3 release; its version is the one Upkeep installed.
[apps.ghg]
name = "ghg"
kind = "archive"
repo = "Songmu/ghg"
asset = '^ghg_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^ghg_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ghg"
folder = "~/.local/share/ghg"
bins = ["ghg"]
probe = false
