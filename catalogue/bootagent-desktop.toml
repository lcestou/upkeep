# Drafted from MaimoryLab/BootAgent's v0.9.0 release; its version is the one Upkeep installed.
[apps.bootagent-desktop]
name = "ota-BootAgent"
kind = "archive"
repo = "MaimoryLab/BootAgent"
asset = '^ota-BootAgent-linux-amd64\.zip$'
asset_aarch64 = '^ota-BootAgent-linux-arm64\.zip$'
dest = "~/.local/bin/bootagent-desktop"
bins = ["bootagent-desktop"]
probe = false
