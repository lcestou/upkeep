# Drafted from smallstep/certificates's v0.30.2 release.
[apps.step-ca]
name = "certificates"
kind = "archive"
repo = "smallstep/certificates"
asset = '^step-ca_linux_amd64\.tar\.gz$'
asset_aarch64 = '^step-ca_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/step-ca"
bins = ["step-ca_linux_amd64/step-ca"]
