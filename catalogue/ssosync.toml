# Drafted from awslabs/ssosync's v2.11.1 release; its version is the one Upkeep installed.
[apps.ssosync]
name = "ssosync"
kind = "archive"
repo = "awslabs/ssosync"
asset = '^ssosync_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^ssosync_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/ssosync"
bins = ["ssosync"]
probe = false
