# Drafted from omnirush-ai/omnirush-gui's v3.8.5 release; its version is the one Upkeep installed.
[apps.omnirush]
name = "Omnirush Gui"
kind = "appimage"
repo = "omnirush-ai/omnirush-gui"
asset = '^omnirush-linux-x86_64-.*\.AppImage$'
asset_aarch64 = '^omnirush-linux-arm64-.*\.AppImage$'
dest = "~/.local/bin/omnirush.AppImage"
probe = false
