# Drafted from mavlink/qgroundcontrol's v5.1.5 release; its version is the one Upkeep installed.
[apps.qgroundcontrol]
name = "QGroundControl"
kind = "appimage"
repo = "mavlink/qgroundcontrol"
asset = '^QGroundControl-x86_64\.AppImage$'
asset_aarch64 = '^QGroundControl-aarch64\.AppImage$'
dest = "~/.local/bin/qgroundcontrol.AppImage"
probe = false
