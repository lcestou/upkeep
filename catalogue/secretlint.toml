# Drafted from secretlint/secretlint's v13.1.0 release; its version is the one Upkeep installed.
[apps.secretlint]
name = "secretlint"
kind = "file"
repo = "secretlint/secretlint"
asset = '^secretlint-.*-linux-x64$'
asset_aarch64 = '^secretlint-.*-linux-arm64$'
dest = "~/.local/bin/secretlint"
probe = false
