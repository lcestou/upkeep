# Drafted from tetratelabs/func-e's v1.6.0 release; its version is the one Upkeep installed.
[apps.func-e]
name = "Func E"
kind = "archive"
repo = "tetratelabs/func-e"
asset = '^func-e_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^func-e_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/func-e"
bins = ["func-e"]
probe = false
