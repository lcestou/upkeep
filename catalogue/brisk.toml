# Drafted from BrisklyDev/brisk's v2.5.0 release; its version is the one Upkeep installed.
[apps.brisk]
name = "Brisk"
kind = "archive"
repo = "BrisklyDev/brisk"
asset = '^Brisk-.*-linux-x86_64\.tar\.xz$'
dest = "~/.local/bin/brisk"
folder = "~/.local/share/brisk"
bins = ["brisk", "updater/brisk_auto_updater"]
probe = false
