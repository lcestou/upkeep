# Drafted from mattn/twty's v0.1.7 release; its version is the one Upkeep installed.
[apps.twty]
name = "twty"
kind = "archive"
repo = "mattn/twty"
asset = '^twty_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^twty_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/twty"
folder = "~/.local/share/twty"
bins = ["twty"]
probe = false
