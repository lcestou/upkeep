# Drafted from Macmod/godap's v2.12.2 release; its version is the one Upkeep installed.
[apps.godap]
name = "godap"
kind = "archive"
repo = "Macmod/godap"
asset = '^godap-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^godap-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/godap"
bins = ["godap"]
probe = false
