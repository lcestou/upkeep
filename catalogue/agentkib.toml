# Drafted from starroyhq/agentkib's v0.30.0 release; its version is the one Upkeep installed.
[apps.agentkib]
name = "AgentKib"
kind = "appimage"
repo = "starroyhq/agentkib"
asset = '^AgentKib_.*_linux-x86_64\.AppImage$'
asset_aarch64 = '^AgentKib_.*_linux-arm64\.AppImage$'
dest = "~/.local/bin/agentkib.AppImage"
probe = false
