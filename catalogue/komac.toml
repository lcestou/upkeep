# Drafted from russellbanks/Komac's v2.17.2 release; its version is the one Upkeep installed.
[apps.komac]
name = "Komac"
kind = "archive"
repo = "russellbanks/Komac"
asset = '^komac-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^komac-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/komac"
bins = ["komac"]
probe = false
