# Drafted from harness/drone-cli's v1.9.0 release; its version is the one Upkeep installed.
[apps.drone]
name = "Drone Cli"
kind = "archive"
repo = "harness/drone-cli"
asset = '^drone_linux_amd64\.tar\.gz$'
asset_aarch64 = '^drone_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/drone"
bins = ["drone"]
probe = false
