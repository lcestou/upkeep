# Drafted from hivepaas/shellwing's v0.2.1 release; its version is the one Upkeep installed.
[apps.shellwing]
name = "shellwing"
kind = "appimage"
repo = "hivepaas/shellwing"
asset = '^shellwing_.*_linux_x86_64\.AppImage$'
asset_aarch64 = '^shellwing_.*_linux_aarch64\.AppImage$'
dest = "~/.local/bin/shellwing.AppImage"
probe = false
