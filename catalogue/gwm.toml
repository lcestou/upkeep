# Drafted from kbrdn1/gwm-cli's v1.11.0 release.
[apps.gwm]
name = "Gwm Cli"
kind = "archive"
repo = "kbrdn1/gwm-cli"
asset = '^gwm-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^gwm-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/gwm"
folder = "~/.local/share/gwm"
bins = ["gwm"]
