# Drafted from FairwindsOps/pluto's v5.24.5 release; its version is the one Upkeep installed.
[apps.pluto]
name = "pluto"
kind = "archive"
repo = "FairwindsOps/pluto"
asset = '^pluto_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^pluto_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/pluto"
bins = ["pluto"]
probe = false
