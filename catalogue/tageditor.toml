# Drafted from Martchus/tageditor's v3.9.11 release; its version is the one Upkeep installed.
[apps.tageditor]
name = "tageditor"
kind = "archive"
repo = "Martchus/tageditor"
asset = '^tageditor-.*-x86_64-pc-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/tageditor"
folder = "~/.local/share/tageditor"
bins = ["tageditor"]
probe = false
