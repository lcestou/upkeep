# Drafted from traefik/yaegi's v0.16.3 release; its version is the one Upkeep installed.
[apps.yaegi]
name = "yaegi"
kind = "archive"
repo = "traefik/yaegi"
asset = '^yaegi_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^yaegi_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/yaegi"
bins = ["yaegi"]
probe = false
