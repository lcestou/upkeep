# Drafted from remko/age-plugin-se's v0.2.1 release; its version is the one Upkeep installed.
[apps.age-plugin-se]
name = "Age Plugin Se"
kind = "archive"
repo = "remko/age-plugin-se"
asset = '^age-plugin-se-.*-x86_64-linux\.tgz$'
