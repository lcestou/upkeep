# Drafted from juicedata/juicefs's v1.4.2 release; its version is the one Upkeep installed.
[apps.juicefs]
name = "juicefs"
kind = "archive"
repo = "juicedata/juicefs"
asset = '^juicefs-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^juicefs-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/juicefs"
bins = ["juicefs"]
probe = false
