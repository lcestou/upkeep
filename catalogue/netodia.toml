# Drafted from HELPMEEADICE/Netodia's v0.1.7 release; its version is the one Upkeep installed.
[apps.netodia]
name = "Netodia"
kind = "appimage"
repo = "HELPMEEADICE/Netodia"
asset = '^netodia-.*-x86_64\.AppImage$'
asset_aarch64 = '^netodia-.*-aarch64\.AppImage$'
dest = "~/.local/bin/netodia.AppImage"
probe = false
