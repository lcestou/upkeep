# Drafted from robscott/kube-capacity's v0.8.0 release; its version is the one Upkeep installed.
[apps.kube-capacity]
name = "Kube Capacity"
kind = "archive"
repo = "robscott/kube-capacity"
asset = '^kube-capacity_.*_linux_x86_64\.tar\.gz$'
asset_aarch64 = '^kube-capacity_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kube-capacity"
bins = ["kube-capacity"]
probe = false
