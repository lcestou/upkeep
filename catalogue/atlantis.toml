# Drafted from runatlantis/atlantis's v0.49.0 release; its version is the one Upkeep installed.
[apps.atlantis]
name = "atlantis"
kind = "archive"
repo = "runatlantis/atlantis"
asset = '^atlantis_linux_amd64\.zip$'
asset_aarch64 = '^atlantis_linux_arm64\.zip$'
dest = "~/.local/bin/atlantis"
bins = ["atlantis"]
probe = false
