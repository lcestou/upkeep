name = "WebSocketReflectorX"
kind = "appimage"
repo = "XDSEC/WebSocketReflectorX"
asset = '^WebSocketReflectorX-.*-linux-gnu-x86_64\.AppImage$'
dest = "~/.local/bin/wsrx-cli.AppImage"
probe = false
