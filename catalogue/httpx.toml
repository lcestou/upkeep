# Drafted from projectdiscovery/httpx's v1.12.0 release; its version is the one Upkeep installed.
[apps.httpx]
name = "httpx"
kind = "archive"
repo = "projectdiscovery/httpx"
asset = '^httpx_.*_linux_amd64\.zip$'
asset_aarch64 = '^httpx_.*_linux_arm64\.zip$'
dest = "~/.local/bin/httpx"
bins = ["httpx"]
probe = false
