# Drafted from koki-develop/clive's v0.12.17 release; its version is the one Upkeep installed.
[apps.clive]
name = "clive"
kind = "archive"
repo = "koki-develop/clive"
asset = '^clive_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^clive_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/clive"
bins = ["clive"]
probe = false
