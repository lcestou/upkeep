# Drafted from foundry-rs/foundry's v1.9.0 release; its version is the one Upkeep installed.
[apps.anvil]
name = "foundry"
kind = "archive"
repo = "foundry-rs/foundry"
asset = '^foundry_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^foundry_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/anvil"
bins = ["anvil"]
probe = false
