# Drafted from NetApp/trident's v26.10.1 release; its version is the one Upkeep installed.
[apps.trident]
name = "trident"
kind = "archive"
repo = "NetApp/trident"
asset = '^trident-installer-.*\.tar\.gz$'
dest = "~/.local/bin/trident"
folder = "~/.local/share/trident"
bins = ["extras/bin/trident", "tridentctl"]
probe = false
