# Drafted from protocolbuffers/protobuf-javascript's v4.0.3 release.
[apps.protoc-gen-js]
name = "Protobuf Javascript"
kind = "archive"
repo = "protocolbuffers/protobuf-javascript"
asset = '^protobuf-javascript-.*-linux-x86_64\.zip$'
dest = "~/.local/bin/protoc-gen-js"
folder = "~/.local/share/protoc-gen-js"
bins = ["bin/protoc-gen-js"]
