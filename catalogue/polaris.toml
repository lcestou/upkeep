# Drafted from FairwindsOps/polaris's v10.2.6 release.
[apps.polaris]
name = "polaris"
kind = "archive"
repo = "FairwindsOps/polaris"
asset = '^polaris_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^polaris_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/polaris"
bins = ["polaris"]
version_args = ["version"]
