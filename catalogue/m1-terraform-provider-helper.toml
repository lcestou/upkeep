# Drafted from kreuzwerker/m1-terraform-provider-helper's v0.10.1 release; its version is the one Upkeep installed.
[apps.m1-terraform-provider-helper]
name = "M1 Terraform Provider Helper"
kind = "archive"
repo = "kreuzwerker/m1-terraform-provider-helper"
asset = '^m1-terraform-provider-helper_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^m1-terraform-provider-helper_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/m1-terraform-provider-helper"
bins = ["m1-terraform-provider-helper"]
probe = false
