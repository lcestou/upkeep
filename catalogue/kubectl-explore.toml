# Drafted from keisku/kubectl-explore's v0.14.1 release; its version is the one Upkeep installed.
[apps.kubectl-explore]
name = "Kubectl Explore"
kind = "archive"
repo = "keisku/kubectl-explore"
asset = '^kubectl-explore_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^kubectl-explore_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/kubectl-explore"
bins = ["kubectl-explore"]
probe = false
