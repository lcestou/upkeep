# Drafted from hexdigest/gowrap's v1.5.0 release; its version is the one Upkeep installed.
[apps.gowrap]
name = "gowrap"
kind = "archive"
repo = "hexdigest/gowrap"
asset = '^gowrap_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^gowrap_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gowrap"
bins = ["gowrap"]
probe = false
