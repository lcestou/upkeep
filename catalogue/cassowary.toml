# Drafted from rogerwelin/cassowary's v0.19.0 release; its version is the one Upkeep installed.
[apps.cassowary]
name = "cassowary"
kind = "archive"
repo = "rogerwelin/cassowary"
asset = '^cassowary_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^cassowary_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/cassowary"
bins = ["cassowary"]
probe = false
