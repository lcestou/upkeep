# Drafted from anordal/shellharden's v4.3.2 release; its version is the one Upkeep installed.
[apps.shellharden]
name = "shellharden"
kind = "archive"
repo = "anordal/shellharden"
asset = '^shellharden-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^shellharden-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/shellharden"
bins = ["shellharden"]
probe = false
