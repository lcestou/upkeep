# Drafted from buckets/application's v0.80.0 release.
[apps.buckets]
name = "Buckets-latest"
kind = "appimage"
repo = "buckets/application"
asset = '^Buckets-linux-latest-amd64-.*\.AppImage$'
asset_aarch64 = '^Buckets-linux-latest-arm64-.*\.AppImage$'
dest = "~/.local/bin/buckets.AppImage"
meta_path = "buckets.desktop"
