# Drafted from redhat-et/ripwire's v0.6.10 release.
[apps.ripwire]
name = "ripwire"
kind = "archive"
repo = "redhat-et/ripwire"
asset = '^ripwire-.*-linux-x64\.tar\.gz$'
asset_aarch64 = '^ripwire-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/ripwire"
folder = "~/.local/share/ripwire"
bins = ["ripwire"]
