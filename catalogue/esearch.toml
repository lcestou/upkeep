# Drafted from xushengfeng/eSearch's 15.8.0 release; its version is the one Upkeep installed.
[apps.esearch]
name = "eSearch"
kind = "appimage"
repo = "xushengfeng/eSearch"
asset = '^eSearch-.*-linux-x64\.AppImage$'
asset_aarch64 = '^eSearch-.*-linux-arm64\.AppImage$'
dest = "~/.local/bin/esearch.AppImage"
probe = false
