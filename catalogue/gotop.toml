# Drafted from xxxserxxx/gotop's v4.2.0 release; its version is the one Upkeep installed.
[apps.gotop]
name = "gotop"
kind = "archive"
repo = "xxxserxxx/gotop"
asset = '^gotop_.*_linux_amd64\.tgz$'
asset_aarch64 = '^gotop_.*_linux_arm64\.tgz$'
dest = "~/.local/bin/gotop"
bins = ["gotop"]
probe = false
