# Drafted from Xpl0itU/WiiUDownloader's v3.2 release; its version is the one Upkeep installed.
[apps.wiiudownloader]
name = "WiiUDownloader"
kind = "appimage"
repo = "Xpl0itU/WiiUDownloader"
