# Drafted from nadoo/glider's v0.16.4 release; its version is the one Upkeep installed.
[apps.glider]
name = "glider"
kind = "archive"
repo = "nadoo/glider"
asset = '^glider_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^glider_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/glider"
folder = "~/.local/share/glider"
bins = ["glider"]
probe = false
