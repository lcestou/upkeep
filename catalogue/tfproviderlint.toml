# Drafted from bflad/tfproviderlint's v0.31.0 release.
[apps.tfproviderlint]
name = "tfproviderlint"
kind = "archive"
repo = "bflad/tfproviderlint"
asset = '^tfproviderlint_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^tfproviderlint_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/tfproviderlint"
bins = ["tfproviderlint", "tfproviderlintx"]
