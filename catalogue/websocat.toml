# Drafted from vi/websocat's v1.14.2 release; its version is the one Upkeep installed.
[apps.websocat]
name = "websocat"
kind = "file"
repo = "vi/websocat"
asset = '^websocat\.x86_64-unknown-linux-musl$'
asset_aarch64 = '^websocat\.aarch64-unknown-linux-musl$'
dest = "~/.local/bin/websocat"
probe = false
