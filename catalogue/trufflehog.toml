# Drafted from trufflesecurity/trufflehog's v3.99.9 release; its version is the one Upkeep installed.
[apps.trufflehog]
name = "trufflehog"
kind = "archive"
repo = "trufflesecurity/trufflehog"
asset = '^trufflehog_.*_linux_amd64\.tar\.gz$'
asset_aarch64 = '^trufflehog_.*_linux_arm64\.tar\.gz$'
dest = "~/.local/bin/trufflehog"
bins = ["trufflehog"]
probe = false
