# Drafted from int128/kauthproxy's v1.2.6 release; its version is the one Upkeep installed.
[apps.kauthproxy]
name = "kauthproxy"
kind = "archive"
repo = "int128/kauthproxy"
asset = '^kauthproxy_linux_amd64\.zip$'
asset_aarch64 = '^kauthproxy_linux_arm64\.zip$'
dest = "~/.local/bin/kauthproxy"
bins = ["kauthproxy"]
probe = false
