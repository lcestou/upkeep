# Drafted from tattoy-org/tattoy's tattoy-v0.1.8 release; its version is the one Upkeep installed.
[apps.tattoy]
name = "tattoy"
kind = "archive"
repo = "tattoy-org/tattoy"
asset = '^tattoy-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^tattoy-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/tattoy"
bins = ["tattoy"]
probe = false
