# Drafted from jesseduffield/horcrux's v0.2 release; its version is the one Upkeep installed.
[apps.horcrux]
name = "horcrux"
kind = "archive"
repo = "jesseduffield/horcrux"
asset = '^horcrux_.*_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^horcrux_.*_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/horcrux"
bins = ["horcrux"]
probe = false
