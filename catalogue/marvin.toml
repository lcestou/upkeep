# Drafted from undistro/marvin's v0.2.13 release; its version is the one Upkeep installed.
[apps.marvin]
name = "marvin"
kind = "archive"
repo = "undistro/marvin"
asset = '^marvin_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^marvin_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/marvin"
bins = ["marvin"]
probe = false
