# Drafted from Adembc/lazyssh's v0.3.0 release; its version is the one Upkeep installed.
[apps.lazyssh]
name = "lazyssh"
kind = "archive"
repo = "Adembc/lazyssh"
asset = '^lazyssh_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^lazyssh_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/lazyssh"
bins = ["lazyssh"]
probe = false
