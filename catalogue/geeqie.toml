# Drafted from BestImageViewer/geeqie's v3.4 release; its version is the one Upkeep installed.
[apps.geeqie]
name = "Geeqie"
kind = "appimage"
repo = "BestImageViewer/geeqie"
asset = '^Geeqie-[0-9][0-9A-Za-z.]*-x86_64\.AppImage$'
asset_aarch64 = '^Geeqie-[0-9][0-9A-Za-z.]*-aarch64\.AppImage$'
dest = "~/.local/bin/geeqie.AppImage"
probe = false
