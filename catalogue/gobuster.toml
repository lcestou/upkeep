# Drafted from OJ/gobuster's v3.8.2 release; its version is the one Upkeep installed.
[apps.gobuster]
name = "gobuster"
kind = "archive"
repo = "OJ/gobuster"
asset = '^gobuster_Linux_x86_64\.tar\.gz$'
asset_aarch64 = '^gobuster_Linux_arm64\.tar\.gz$'
dest = "~/.local/bin/gobuster"
bins = ["gobuster"]
probe = false
