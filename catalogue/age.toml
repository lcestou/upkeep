# Drafted from FiloSottile/age's v1.3.2 release.
[apps.age]
name = "age"
kind = "archive"
repo = "FiloSottile/age"
asset = '^age-.*-linux-amd64\.tar\.gz$'
asset_aarch64 = '^age-.*-linux-arm64\.tar\.gz$'
dest = "~/.local/bin/age"
folder = "~/.local/share/age"
bins = ["age", "age-inspect", "age-keygen", "age-plugin-batchpass", "age-plugin-pq", "age-plugin-tag"]
