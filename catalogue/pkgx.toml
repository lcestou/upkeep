# Drafted from pkgxdev/pkgx's v2.11.0 release; its version is the one Upkeep installed.
[apps.pkgx]
name = "pkgx"
kind = "archive"
repo = "pkgxdev/pkgx"
asset = '^pkgx-.*\+linux\+x86-64\.tar\.gz$'
asset_aarch64 = '^pkgx-.*\+linux\+aarch64\.tar\.gz$'
dest = "~/.local/bin/pkgx"
bins = ["pkgx"]
probe = false
