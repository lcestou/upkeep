# Drafted from storytold/cadcraft's v0.20.1 release; its version is the one Upkeep installed.
[apps.cadcraft]
name = "cadcraft"
kind = "appimage"
repo = "storytold/cadcraft"
asset = '^cadcraft-.*-linux-x86_64\.AppImage$'
asset_aarch64 = '^cadcraft-.*-linux-aarch64\.AppImage$'
dest = "~/.local/bin/cadcraft.AppImage"
probe = false
