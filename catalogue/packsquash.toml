# Drafted from ComunidadAylas/PackSquash's v0.4.1 release.
[apps.packsquash]
name = "PackSquash"
kind = "archive"
repo = "ComunidadAylas/PackSquash"
asset = '^packsquash-x86_64-unknown-linux-gnu\.zip$'
