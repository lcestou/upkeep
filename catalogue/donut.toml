# Drafted from donutbrowser/donutbrowser's v0.36.0 release; its version is the one Upkeep installed.
[apps.donut]
name = "Donut"
kind = "appimage"
repo = "donutbrowser/donutbrowser"
asset = '^Donut_.*_amd64\.AppImage$'
asset_aarch64 = '^Donut_.*_aarch64\.AppImage$'
dest = "~/.local/bin/donut.AppImage"
probe = false
