# Drafted from sourcemeta/jsonschema's v17.3.3 release; its version is the one Upkeep installed.
[apps.jsonschema]
name = "jsonschema"
kind = "archive"
repo = "sourcemeta/jsonschema"
asset = '^jsonschema-.*-linux-x86_64-musl\.zip$'
asset_aarch64 = '^jsonschema-.*-linux-arm64-musl\.zip$'
dest = "~/.local/bin/jsonschema"
bins = ["jsonschema-17.3.3-linux-x86_64-musl/bin/jsonschema"]
probe = false
