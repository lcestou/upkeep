# Drafted from Martchus/syncthingtray's v2.1.9 release; its version is the one Upkeep installed.
[apps.syncthingctl]
name = "syncthingtray"
kind = "archive"
repo = "Martchus/syncthingtray"
asset = '^syncthingctl-.*-x86_64-pc-linux-gnu\.tar\.xz$'
dest = "~/.local/bin/syncthingctl"
folder = "~/.local/share/syncthingctl"
bins = ["syncthingctl"]
probe = false
