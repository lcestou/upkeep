# Drafted from rustic-rs/rustic's v0.11.4 release; its version is the one Upkeep installed.
[apps.rustic]
name = "rustic"
kind = "archive"
repo = "rustic-rs/rustic"
asset = '^rustic-.*-x86_64-unknown-linux-gnu\.tar\.gz$'
asset_aarch64 = '^rustic-.*-aarch64-unknown-linux-gnu\.tar\.gz$'
dest = "~/.local/bin/rustic"
folder = "~/.local/share/rustic"
bins = ["rustic"]
probe = false
