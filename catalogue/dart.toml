# Drafted from sass/dart-sass's 1.108.2 release; its version is the one Upkeep installed.
[apps.dart]
name = "Dart Sass"
kind = "archive"
repo = "sass/dart-sass"
asset = '^dart-sass-.*-linux-x64-musl\.tar\.gz$'
asset_aarch64 = '^dart-sass-.*-linux-arm64-musl\.tar\.gz$'
dest = "~/.local/bin/dart"
folder = "~/.local/share/dart"
bins = ["src/dart"]
probe = false
